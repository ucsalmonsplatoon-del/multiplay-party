<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>JailBreakers</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#222;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;}
#join-screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#1a1a2e;z-index:100;font-family:sans-serif;}
#join-screen h1{color:#fff;margin-bottom:8px;}
#join-screen .sub{color:#aaa;font-size:13px;margin-bottom:20px;}
#join-screen input{padding:10px 16px;font-size:16px;border-radius:8px;border:none;width:200px;text-align:center;margin-bottom:12px;}
#join-screen button{padding:10px 32px;font-size:16px;border-radius:8px;border:none;background:#FFA726;color:#000;cursor:pointer;font-weight:bold;}
#join-screen button:disabled{opacity:0.4;}
#wait-msg{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#1a1a2e;z-index:90;color:#fff;font-family:sans-serif;font-size:18px;flex-direction:column;}
</style>
</head>

<div id="join-screen">
  <h1>JailBreakers</h1>
  <div class="sub" id="room-info"></div>
  <input id="name-input" type="text" placeholder="名前を入力" maxlength="10">
  <br><button id="join-btn" disabled>参加</button>
</div>

<canvas id="c"></canvas>

var IMG = {};
var imgList = ["music_rouya","floor1","prio1","prio1_2","pri2","pri2_2","obake","toge","door_closed","door_open","win","lose","exclamation"];
var loaded = 0;

function loadImages(cb) {
  for (var i = 0; i < imgList.length; i++) {
    var n = imgList[i];
    (function(name) {
      var img = new Image();
      img.onload = function() { loaded++; if (loaded >= imgList.length) cb(); };
      img.onerror = function() { loaded++; if (loaded >= imgList.length) cb(); };
      img.src = "assets/" + name + ".png";
      IMG[name] = img;
    })(n);
  }
}

var canvas = document.getElementById("c");
var ctx = canvas.getContext("2d");
var W, H, SC;

function resize() {
  W = innerWidth; H = innerHeight;
  var dpr = window.devicePixelRatio || 1;
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
  SC = Math.min(W / 320, H / 180) * dpr;
}
resize();
addEventListener("resize", resize);

var GROUND_Y = 178;
var GRAVITY = 0.28;
var JUMP_FORCE = -7;
var GHOST_SPEED_INIT = 1.3;
var GHOST_SPEED_ACCEL = 0.02;
var GAME_DURATION = 90;
var HP_MAX = 7;
var ESCAPE_SCORE = 20000;
var SCROLL_SPEED = 1.5;

var phase = "join";
var myId = null;
var channel = null;
var allPlayers = [];
var myIndex = -1;

var playerX = 104;
var playerY = GROUND_Y;
var playerVY = 0;
var isJumping = false;
var hp = HP_MAX;
var score = 0;
var combo = 0;
var maxCombo = 0;
var dodgeCount = 0;

var hitAnim = null;
var ghosts = [];
var ghostSpeed = GHOST_SPEED_INIT;
var ghostCooldown = 0;
var hasShield = false;  // shield gift from teammate

// Teammate local simulation
var teammates = {}; // playerId -> { playerY, playerVY, isJumping, ghosts:[], hp, combo, isP2, hitAnim }

var scrollX = 0;
var countdownStart = 0;
var gameStart = 0;
var bgm = null;
var lastFrame = 0;

var debugMode = params.has("debug");
var debugSelected = null;
var debugDragging = false;
var debugDragOff = {x:0, y:0};

var DO = {
  bg:    { name: "bg",    x: -13, y: -21, w: 320, h: 180, s: 1 },
  floor: { name: "floor", x: -3,  y: 179, w: 320, h: 20,  s: 2.5 },
  door:  { name: "door",  x: 268, y: -69, w: 25,  h: 50,  s: 5 },
  player:{ name: "player", x: 104, y: 178, w: 15,  h: 15,  s: 2.5 },
  ghost: { name: "ghost",  x: 280, y: 178, w: 16, h: 16,  s: 2.5 }
};
var debugObjects = [DO.bg, DO.floor, DO.door, DO.player, DO.ghost];

if (debugMode) {
  var dbtn = document.createElement("button");
  dbtn.textContent = "Copy Layout";
  dbtn.style.cssText = "position:fixed;top:8px;right:8px;z-index:200;padding:8px 12px;border:none;border-radius:8px;background:#0a0;color:#fff;font-size:13px;cursor:pointer;";
  dbtn.addEventListener("click", function() {
    var data = {};
    for (var i = 0; i < debugObjects.length; i++) { var o = debugObjects[i]; data[o.name] = { x: o.x, y: o.y, s: o.s }; }
    var text = JSON.stringify(data, null, 2);
    navigator.clipboard.writeText(text).then(function() { dbtn.textContent = "Copied!"; })
    .catch(function() { prompt("Copy:", text); });
    setTimeout(function() { dbtn.textContent = "Copy Layout"; }, 2000);
  });
  document.body.appendChild(dbtn);

  var toggleBtn = document.createElement("button");
  toggleBtn.textContent = "Debug OFF";
  toggleBtn.style.cssText = "position:fixed;top:8px;left:8px;z-index:200;padding:8px 12px;border:none;border-radius:8px;background:#333;color:#fff;font-size:13px;cursor:pointer;";
  toggleBtn.addEventListener("click", function() {
    debugMode = !debugMode;
    toggleBtn.textContent = debugMode ? "Debug OFF" : "Debug ON";
    debugSelected = null;
  });
  document.body.appendChild(toggleBtn);

  var scaleUp = document.createElement("button");
  scaleUp.textContent = "+ Scale";
  scaleUp.style.cssText = "position:fixed;bottom:50px;right:8px;z-index:200;padding:8px;border:none;border-radius:8px;background:#555;color:#fff;font-size:13px;cursor:pointer;";
  scaleUp.addEventListener("click", function() { if (debugSelected) { debugSelected.s = Math.round((debugSelected.s + 0.5) * 10) / 10; } });
  document.body.appendChild(scaleUp);

  var scaleDown = document.createElement("button");
  scaleDown.textContent = "- Scale";
  scaleDown.style.cssText = "position:fixed;bottom:90px;right:8px;z-index:200;padding:8px;border:none;border-radius:8px;background:#555;color:#fff;font-size:13px;cursor:pointer;";
  scaleDown.addEventListener("click", function() { if (debugSelected) { debugSelected.s = Math.max(0.5, Math.round((debugSelected.s - 0.5) * 10) / 10); } });
  document.body.appendChild(scaleDown);
}

function drawDebugOverlay() {
  ctx.save();
  var dpr = window.devicePixelRatio || 1;
  var ox = (W * dpr - 320 * SC) / 2;
  var oy = (H * dpr - 180 * SC) / 2;
  ctx.translate(ox, oy);
  ctx.scale(SC, SC);
  for (var i = 0; i < debugObjects.length; i++) {
    var obj = debugObjects[i];
    var sel = obj === debugSelected;
    ctx.strokeStyle = sel ? "#0f0" : "#ff0";
    ctx.lineWidth = sel ? 1.5 : 0.5;
    ctx.setLineDash(sel ? [] : [3, 3]);
    ctx.strokeRect(obj.x, obj.y - obj.h * obj.s, obj.w * obj.s, obj.h * obj.s);
    ctx.fillStyle = sel ? "#0f0" : "#ff0";
    ctx.font = "6px monospace";
    ctx.fillText(obj.name + " (" + Math.round(obj.x) + "," + Math.round(obj.y) + ") s=" + obj.s.toFixed(1), obj.x, obj.y - obj.h * obj.s - 2);
  }
  ctx.setLineDash([]);
  ctx.fillStyle = "rgba(0,0,0,0.8)";
  ctx.fillRect(0, 0, 160, 50);
  ctx.fillStyle = "#0f0";
  ctx.font = "bold 7px monospace";
  ctx.fillText("DEBUG MODE [D=toggle]", 4, 8);
  ctx.fillText("[Click=select] [Drag=move]", 4, 16);
  ctx.fillText("[+/-=scale] [Arrow=nudge]", 4, 24);
  if (debugSelected) {
    ctx.fillStyle = "#ff0";
    ctx.fillText("Selected: " + debugSelected.name, 4, 34);
    ctx.fillText("x=" + Math.round(debugSelected.x) + " y=" + Math.round(debugSelected.y) + " s=" + debugSelected.s.toFixed(1), 4, 42);
  }
  ctx.restore();
}

var opponentScore = 0;
var opponentHP = HP_MAX;
var teamScore = 0;
var sharedCombo = 0;
var playerScores = {};

function jump() {
  if (phase !== "playing") return;
  if (hitAnim) return;
  // Resume BGM on first user interaction (autoplay policy workaround)
  if (bgm && bgm.paused) bgm.play().catch(function() {});
  if (!isJumping) { playerVY = JUMP_FORCE; isJumping = true; broadcastJump(); }
}

function screenToGame(clientX, clientY) {
  var dpr = window.devicePixelRatio || 1;
  var ox = (W - 320 * SC / dpr) / 2;
  var oy = (H - 180 * SC / dpr) / 2;
  return { x: (clientX - ox) / (SC / dpr), y: (clientY - oy) / (SC / dpr) };
}

canvas.addEventListener("pointerdown", function(e) {
  e.preventDefault();
  if (debugMode) {
    var m = screenToGame(e.clientX, e.clientY);
    debugSelected = null;
    var bestArea = Infinity;
    for (var i = 0; i < debugObjects.length; i++) {
      var obj = debugObjects[i];
      var bw = obj.w * obj.s, bh = obj.h * obj.s;
      var bx = obj.x, by = obj.y - bh;
      if (m.x >= bx && m.x <= bx + bw && m.y >= by && m.y <= by + bh) {
        var area = bw * bh;
        if (area < bestArea) { bestArea = area; debugSelected = obj; }
      }
    }
    if (debugSelected) { debugDragging = true; debugDragOff = { x: m.x - debugSelected.x, y: m.y - debugSelected.y }; }
    return;
  }
  jump();
});
canvas.addEventListener("pointermove", function(e) {
  if (!debugMode || !debugDragging || !debugSelected) return;
  var m = screenToGame(e.clientX, e.clientY);
  debugSelected.x = Math.round(m.x - debugDragOff.x);
  debugSelected.y = Math.round(m.y - debugDragOff.y);
  if (debugSelected.name === "player") { playerX = debugSelected.x; playerY = debugSelected.y; }
});
canvas.addEventListener("pointerup", function() { debugDragging = false; });
addEventListener("keydown", function(e) {
  if (e.key === "d") { debugMode = !debugMode; debugSelected = null; return; }
  if (debugMode && debugSelected) {
    var step = e.shiftKey ? 5 : 1;
    if (e.key === "ArrowLeft") { debugSelected.x -= step; e.preventDefault(); }
    if (e.key === "ArrowRight") { debugSelected.x += step; e.preventDefault(); }
    if (e.key === "ArrowUp") { debugSelected.y -= step; e.preventDefault(); }
    if (e.key === "ArrowDown") { debugSelected.y += step; e.preventDefault(); }
    if (e.key === "=" || e.key === "+") { debugSelected.s = Math.round((debugSelected.s + 0.5) * 10) / 10; }
    if (e.key === "-") { debugSelected.s = Math.max(0.5, Math.round((debugSelected.s - 0.5) * 10) / 10); }
    if (debugSelected.name === "player") { playerX = debugSelected.x; playerY = debugSelected.y; }
    return;
  }
  if (e.key === " " || e.key === "ArrowUp" || e.key === "w") { e.preventDefault(); jump(); }
});

function spawnGhost(fromRight, speed, relayCount) {
  if (fromRight) {
    ghosts.push({ x: 340, speed: speed || ghostSpeed, dir: -1, fromRight: true, active: true, hit: false, relayCount: relayCount || 0 });
  } else {
    ghosts.push({ x: -30, speed: speed || ghostSpeed, dir: 1, fromRight: false, active: true, hit: false, relayCount: relayCount || 0 });
  }
}

function sendGhostToOpponent() {
  if (!channel) return;
  var myIdx = -1;
  for (var i = 0; i < allPlayers.length; i++) { if (allPlayers[i].id === myId) { myIdx = i; break; } }
  var nextIdx = (myIdx + 1) % allPlayers.length;
  var targetId = allPlayers.length > 1 ? allPlayers[nextIdx].id : null;
  // Find the relay count and direction from the ghost that just exited
  var lastRelay = 0;
  var lastFromRight = true;
  for (var ri = 0; ri < ghosts.length; ri++) {
    if (ghosts[ri].dodged && ghosts[ri].relayCount) {
      lastRelay = ghosts[ri].relayCount;
      lastFromRight = ghosts[ri].fromRight;
    }
  }
  // Next player receives ghost from SAME direction (it passed through me)
  channel.send({ type: "broadcast", event: "jailbreak_ghost", payload: {
    fromId: myId, targetId: targetId, speed: ghostSpeed, combo: sharedCombo,
    relayCount: lastRelay, fromRight: lastFromRight
  }});
  broadcastState();
}

function update(dt) {
  if (phase !== "playing") return;
  var elapsed = (performance.now() - gameStart) / 1000;

  scrollX += SCROLL_SPEED;

  if (hitAnim) {
    hitAnim.timer += dt;
    hitAnim.spinAngle += 0.4;
    if (hitAnim.phase === "spin_up") {
      hitAnim.vy += 0.15; playerY += hitAnim.vy;
      if (hitAnim.vy > 0) hitAnim.phase = "fall";
    } else if (hitAnim.phase === "fall") {
      hitAnim.vy += 0.4; playerY += hitAnim.vy;
      if (playerY >= GROUND_Y) {
        if (hitAnim.dead) {
          hitAnim.phase = "buried"; playerY = GROUND_Y + 10; hitAnim.spinAngle = Math.PI;
          setTimeout(function() { endGame(); }, 1500);
        } else { hitAnim.phase = "land"; playerY = GROUND_Y; hitAnim.vy = -3; }
      }
    } else if (hitAnim.phase === "land") {
      hitAnim.vy += 0.5; playerY += hitAnim.vy; hitAnim.spinAngle *= 0.9;
      if (playerY >= GROUND_Y) { playerY = GROUND_Y; hitAnim = null; isJumping = false; }
    }
    return;
  }

  playerVY += GRAVITY; playerY += playerVY;
  if (playerY >= GROUND_Y) { playerY = GROUND_Y; playerVY = 0; isJumping = false; }

  ghostCooldown -= dt;
  if (ghosts.length === 0 && ghostCooldown <= 0) {
    // Spawn from random direction
    spawnGhost(Math.random() > 0.5);
    if (allPlayers.length < 2) {
      ghostCooldown = Math.max(800, 2500 - dodgeCount * 30);
    } else {
      // Multiplayer: less frequent self-spawn (relay ghosts fill the gap)
      ghostCooldown = Math.max(1500, 4000 - dodgeCount * 30);
    }
  }

  for (var i = 0; i < ghosts.length; i++) {
    var g = ghosts[i];
    if (!g.active) continue;
    g.x += g.dir * (g.speed + SCROLL_SPEED);

    // Already dodged — sprint to opposite edge, then send to next player
    if (g.dodged) {
      g.x += g.exitDir * 6; // fast exit in opposite direction of entry
      if ((g.exitDir < 0 && g.x < -40) || (g.exitDir > 0 && g.x > 340)) {
        g.active = false;
        sendGhostToOpponent();
        broadcastState();
      }
      continue;
    }

    var isNear = Math.abs(g.x - playerX) < 12;
    if (hitAnim) continue;
    if (isNear && !g.hit) {
      if (playerY < GROUND_Y - 5) {
        // Dodged! Ghost keeps running through to left edge
        g.hit = true;
        g.dodged = true;
        g.exitDir = g.dir; // keep going same direction (right ghost → exits left, left ghost → exits right)
        var relayCount = (g.relayCount || 0) + 1;
        g.relayCount = relayCount;
        dodgeCount++;
        ghostSpeed = GHOST_SPEED_INIT + dodgeCount * GHOST_SPEED_ACCEL;
        combo++; sharedCombo++;
        if (combo > maxCombo) maxCombo = combo;
        // Relay bonus: higher relay = more points
        score += 200 + sharedCombo * 30 + relayCount * 50;
        broadcastState();
        // Shield gift: every 3 combo, send shield to next player
        if (combo % 3 === 0 && combo > 0 && channel) {
          var myIdx2 = -1;
          for (var si = 0; si < allPlayers.length; si++) { if (allPlayers[si].id === myId) { myIdx2 = si; break; } }
          var shieldTarget = allPlayers.length > 1 ? allPlayers[(myIdx2 + 1) % allPlayers.length].id : null;
          if (shieldTarget) {
            channel.send({ type: "broadcast", event: "jailbreak_shield", payload: { fromId: myId, targetId: shieldTarget } });
          }
        }
      } else if (hasShield) {
        // Shield absorbs hit!
        g.hit = true; g.active = false;
        hasShield = false;
        combo = 0; sharedCombo = 0;
        broadcastState();
      } else if (!hitAnim) {
        g.hit = true; g.active = false; hp--; combo = 0; sharedCombo = 0; broadcastState();
        if (channel) channel.send({ type: "broadcast", event: "jailbreak_combo_break", payload: { fromId: myId } });
        hitAnim = { phase: "spin_up", timer: 0, spinAngle: 0, vy: -12, dead: hp <= 0 };
        playerVY = 0; isJumping = true;
        broadcastHit();
      }
    }
    // Off screen right (missed spawn)
    if (g.x < -40 || g.x > 500) g.active = false;
  }
  ghosts = ghosts.filter(function(g) { return g.active; });

  teamScore = score;
  for (var k in playerScores) teamScore += (playerScores[k].score || 0);
  if (teamScore >= ESCAPE_SCORE) { endGame(); return; }
  if (elapsed >= GAME_DURATION) endGame();

  if (allPlayers.length < 2 && ghosts.length === 0 && ghostCooldown <= 0) {
    spawnGhost(Math.random() > 0.5); ghostCooldown = Math.max(800, 2500 - dodgeCount * 30);
  }

  // Update teammate local simulations
  for (var tid in teammates) {
    var tm = teammates[tid];
    // Hit animation
    if (tm.hitAnim) {
      tm.hitAnim.timer += dt;
      tm.hitAnim.spinAngle += 0.4;
      if (tm.hitAnim.phase === "spin_up") {
        tm.hitAnim.vy += 0.15; tm.playerY += tm.hitAnim.vy;
        if (tm.hitAnim.vy > 0) tm.hitAnim.phase = "fall";
      } else if (tm.hitAnim.phase === "fall") {
        tm.hitAnim.vy += 0.4; tm.playerY += tm.hitAnim.vy;
        if (tm.playerY >= GROUND_Y) {
          if (tm.hitAnim.dead) { tm.hitAnim.phase = "buried"; tm.playerY = GROUND_Y + 10; }
          else { tm.hitAnim.phase = "land"; tm.playerY = GROUND_Y; tm.hitAnim.vy = -3; }
        }
      } else if (tm.hitAnim.phase === "land") {
        tm.hitAnim.vy += 0.5; tm.playerY += tm.hitAnim.vy; tm.hitAnim.spinAngle *= 0.9;
        if (tm.playerY >= GROUND_Y) { tm.playerY = GROUND_Y; tm.hitAnim = null; tm.isJumping = false; }
      }
    } else {
      // Normal physics
      tm.playerVY += GRAVITY; tm.playerY += tm.playerVY;
      if (tm.playerY >= GROUND_Y) { tm.playerY = GROUND_Y; tm.playerVY = 0; tm.isJumping = false; }
    }
    // Update teammate ghosts
    for (var tgi = 0; tgi < tm.ghosts.length; tgi++) {
      var tg = tm.ghosts[tgi];
      if (tg.active) { tg.x += tg.dir * (tg.speed + SCROLL_SPEED); if (tg.x < -40) tg.active = false; }
    }
    tm.ghosts = tm.ghosts.filter(function(g) { return g.active; });
  }
}

function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.save();
  ctx.imageSmoothingEnabled = false;
  var dpr = window.devicePixelRatio || 1;

  // Split screen: my game is ALWAYS at the bottom
  var tmCount = Object.keys(teammates).length;
  var totalSlots = 1 + tmCount;
  var slotH2 = Math.floor(H * dpr / totalSlots);
  var mySlotY = (totalSlots - 1) * slotH2; // bottom slot
  var mySC = Math.min(W * dpr / 320, slotH2 / 180);

  var ox = (W * dpr - 320 * mySC) / 2;
  var oy = mySlotY + (slotH2 - 180 * mySC) / 2;

  ctx.beginPath();
  ctx.rect(0, mySlotY, W * dpr, slotH2);
  ctx.clip();
  ctx.translate(ox, oy);
  ctx.scale(mySC, mySC);

  // Sky/outside background (revealed as jail scrolls away)
  var grad = ctx.createLinearGradient(0, 0, 0, DO.floor.y);
  grad.addColorStop(0, "#87CEEB");
  grad.addColorStop(0.7, "#B0E0E6");
  grad.addColorStop(1, "#90EE90");
  ctx.fillStyle = grad;
  ctx.fillRect(-20, -30, 360, 240);

  // Jail cell scrolls away to the left (escape!)
  var jailX = -13 - scrollX;
  if (jailX > -400) {
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 0, 320, DO.floor.y);
    ctx.clip();
    ctx.drawImage(IMG.music_rouya, jailX, -21, 350, 220);
    ctx.restore();
  }

  // Floor tiles (infinite scroll)
  var floorTileW = IMG.floor1.width * DO.floor.s;
  var floorOffset = -(scrollX % floorTileW);
  for (var x = floorOffset - floorTileW; x < 340; x += floorTileW) {
    ctx.drawImage(IMG.floor1, DO.floor.x + x, DO.floor.y, floorTileW, IMG.floor1.height * DO.floor.s);
  }

  var now = performance.now();
  var elapsed = (now - gameStart) / 1000;
  var frame = Math.floor(now / 200) % 2;

  var myPlayerIdx = 0;
  for (var pi = 0; pi < allPlayers.length; pi++) { if (allPlayers[pi].id === myId) { myPlayerIdx = pi; break; } }
  var isP2 = myPlayerIdx >= 1;
  var pImg = isP2
    ? ((hitAnim && hitAnim.phase === "buried") ? IMG.pri2 : (frame === 0 ? IMG.pri2 : IMG.pri2_2))
    : ((hitAnim && hitAnim.phase === "buried") ? IMG.prio1 : (frame === 0 ? IMG.prio1 : IMG.prio1_2));
  var pScale = DO.player.s;
  var pW = pImg.width * pScale;
  var pH = pImg.height * pScale;
  var pDrawX = playerX;
  var pDrawY = playerY - pH + 5;

  ctx.save();
  ctx.shadowColor = "#fff"; ctx.shadowBlur = 3;
  if (hitAnim) {
    var cx = pDrawX + pW / 2, cy = pDrawY + pH / 2;
    ctx.translate(cx, cy); ctx.rotate(hitAnim.spinAngle);
    if (hitAnim.phase === "buried") {
      ctx.drawImage(pImg, -pW / 2, -pH / 2, pW, pH);
      var st = performance.now() / 200;
      for (var si = 0; si < 3; si++) {
        var sa = st + si * 2.1;
        ctx.fillStyle = "#FFD740"; ctx.font = "8px sans-serif";
        ctx.fillText("\u2B50", Math.cos(sa) * 12 - 4, Math.sin(sa) * 8 - pH / 2);
      }
    } else {
      ctx.globalAlpha = hitAnim.dead ? 0.7 : 1;
      ctx.drawImage(pImg, -pW / 2, -pH / 2, pW, pH);
      ctx.globalAlpha = 1;
    }
  } else {
    ctx.translate(pDrawX + pW / 2, pDrawY + pH / 2);
    ctx.drawImage(pImg, -pW / 2, -pH / 2, pW, pH);
  }
  ctx.restore();

  for (var gi = 0; gi < ghosts.length; gi++) {
    var g = ghosts[gi];
    if (!g.active) continue;
    var gScale = DO.ghost.s;
    ctx.save();
    ctx.shadowColor = "#ff4444"; ctx.shadowBlur = 5;
    ctx.drawImage(IMG.obake, g.x - 8 * gScale, GROUND_Y - IMG.obake.height * gScale + 5, IMG.obake.width * gScale, IMG.obake.height * gScale);
    ctx.restore();
  }

  ctx.font = "12px sans-serif";
  for (var hi = 0; hi < HP_MAX; hi++) {
    ctx.fillText(hi < hp ? "\u2764\uFE0F" : "\u{1F5A4}", 8 + hi * 16, 20);
  }

  var timeLeft = Math.max(0, GAME_DURATION - elapsed);
  ctx.fillStyle = "#333"; ctx.fillRect(8, 26, 120, 6);
  ctx.fillStyle = timeLeft < 10 ? "#f44" : "#4CAF50";
  ctx.fillRect(8, 26, (timeLeft / GAME_DURATION) * 120, 6);

  teamScore = score + opponentScore;
  var escapeProgress = Math.min(teamScore / ESCAPE_SCORE, 1);
  ctx.fillStyle = "#333"; ctx.fillRect(140, 4, 170, 8);
  ctx.fillStyle = escapeProgress >= 1 ? "#4CAF50" : "#FFA726";
  ctx.fillRect(140, 4, escapeProgress * 170, 8);
  ctx.strokeStyle = "#fff"; ctx.lineWidth = 0.5; ctx.strokeRect(140, 4, 170, 8);
  ctx.fillStyle = "#fff"; ctx.font = "6px monospace"; ctx.textAlign = "center";
  ctx.fillText("ESCAPE " + Math.floor(escapeProgress * 100) + "%", 225, 10);

  ctx.textAlign = "right"; ctx.font = "bold 9px monospace"; ctx.fillStyle = "#fff";
  ctx.fillText("MY: " + score, 312, 20);
  ctx.fillText("TEAM: " + teamScore, 312, 30);

  if (sharedCombo > 1) {
    ctx.fillStyle = "#FFD740"; ctx.font = "bold 16px sans-serif"; ctx.textAlign = "center";
    ctx.fillText("\uD83D\uDD25 " + sharedCombo + " RALLY!", 160, 75);
  }

  // Shield indicator
  if (hasShield) {
    ctx.fillStyle = "#4FC3F7"; ctx.font = "bold 14px sans-serif"; ctx.textAlign = "left";
    ctx.fillText("\uD83D\uDEE1\uFE0F SHIELD", 8, 55);
  }

  ctx.textAlign = "left"; ctx.font = "7px monospace";
  var sy = 40;
  for (var pid in playerScores) {
    var p = playerScores[pid];
    ctx.fillStyle = p.hp > 0 ? "#8f8" : "#f44";
    ctx.fillText(p.name + ": " + p.score + "pts", 8, sy);
    sy += 10;
  }

  if (elapsed < 5) {
    ctx.textAlign = "center"; ctx.fillStyle = "#FFD740"; ctx.font = "bold 12px sans-serif";
    ctx.fillText("\u30BF\u30C3\u30D7 or \u30B9\u30DA\u30FC\u30B9\u3067\u30B8\u30E3\u30F3\u30D7\uFF01", 160, 110);
  }

  // "YOU" label on my screen
  if (totalSlots > 1) {
    ctx.fillStyle = "#4FC3F7"; ctx.font = "bold 10px sans-serif"; ctx.textAlign = "left";
    ctx.fillText("YOU - " + myId, 8, 168);
  }

  ctx.restore();

  drawTeammateViews();
}

function drawTeammateViews() {
  var tmIds = Object.keys(teammates);
  var totalPlayers = 1 + tmIds.length;
  if (tmIds.length === 0) return;

  var dpr2 = window.devicePixelRatio || 1;
  var canvasH = H * dpr2;
  var canvasW = W * dpr2;
  var slotH = Math.floor(canvasH / totalPlayers);

  for (var ti = 0; ti < tmIds.length; ti++) {
    var tm = teammates[tmIds[ti]];
    var slotY = ti * slotH;
    var tmSC = Math.min(canvasW / 320, slotH / 180);

    ctx.save();
    ctx.beginPath();
    ctx.rect(0, slotY, canvasW, slotH);
    ctx.clip();

    var tmox = (canvasW - 320 * tmSC) / 2;
    var tmoy = slotY + (slotH - 180 * tmSC) / 2;
    ctx.translate(tmox, tmoy);
    ctx.scale(tmSC, tmSC);
    ctx.imageSmoothingEnabled = false;

    // Background
    var bgColors = ["#2a2a3e", "#2a3e2a", "#3e2a2a"];
    ctx.fillStyle = bgColors[ti % bgColors.length];
    ctx.fillRect(-10, -10, 340, 200);

    // Floor
    var tFloorW = IMG.floor1.width * DO.floor.s;
    for (var tfx = 0; tfx < 340; tfx += tFloorW) {
      ctx.drawImage(IMG.floor1, tfx, DO.floor.y, tFloorW, IMG.floor1.height * DO.floor.s);
    }

    // Character
    var tFrame = Math.floor(performance.now() / 200) % 2;
    var tPimg = tm.isP2
      ? (tFrame === 0 ? IMG.pri2 : IMG.pri2_2)
      : (tFrame === 0 ? IMG.prio1 : IMG.prio1_2);
    var tPS = DO.player.s;
    var tPW = tPimg.width * tPS;
    var tPH = tPimg.height * tPS;
    var tPY = (tm.playerY || GROUND_Y) - tPH + 5;

    ctx.save();
    ctx.shadowColor = "#fff"; ctx.shadowBlur = 3;
    if (tm.hitAnim && (tm.hitAnim.phase === "spin_up" || tm.hitAnim.phase === "fall")) {
      ctx.translate(playerX + tPW/2, tPY + tPH/2);
      ctx.rotate(tm.hitAnim.spinAngle);
      ctx.drawImage(tPimg, -tPW/2, -tPH/2, tPW, tPH);
    } else if (tm.hitAnim && tm.hitAnim.phase === "buried") {
      ctx.translate(playerX + tPW/2, GROUND_Y + tPH/2);
      ctx.rotate(Math.PI);
      ctx.drawImage(tPimg, -tPW/2, -tPH/2, tPW, tPH);
    } else {
      ctx.translate(playerX + tPW/2, tPY + tPH/2);
      ctx.drawImage(tPimg, -tPW/2, -tPH/2, tPW, tPH);
    }
    ctx.restore();

    // Ghosts
    var tGS = DO.ghost.s;
    for (var tgi = 0; tgi < tm.ghosts.length; tgi++) {
      if (!tm.ghosts[tgi].active) continue;
      ctx.save();
      ctx.shadowColor = "#ff4444"; ctx.shadowBlur = 5;
      ctx.drawImage(IMG.obake, tm.ghosts[tgi].x - 8*tGS, GROUND_Y - IMG.obake.height*tGS + 5, IMG.obake.width*tGS, IMG.obake.height*tGS);
      ctx.restore();
    }

    // HP
    ctx.font = "12px sans-serif";
    for (var thi = 0; thi < HP_MAX; thi++) {
      ctx.fillText(thi < tm.hp ? "\u2764\uFE0F" : "\u{1F5A4}", 8 + thi * 16, 20);
    }

    // Name
    ctx.fillStyle = "#4FC3F7"; ctx.font = "bold 10px sans-serif"; ctx.textAlign = "left";
    ctx.fillText(tm.name + (tm.hasShield ? " \uD83D\uDEE1\uFE0F" : ""), 8, 168);

    // Combo
    if (tm.combo > 1) {
      ctx.fillStyle = "#FFD740"; ctx.font = "bold 14px sans-serif"; ctx.textAlign = "center";
      ctx.fillText("\uD83D\uDD25 " + tm.combo + " RALLY!", 160, 80);
    }

    // Divider
    ctx.strokeStyle = "#4FC3F7"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(320, 0); ctx.stroke();

    ctx.restore();
  }
}

function renderCountdown() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Calculate slot for split screen (same as render)
  var dpr = window.devicePixelRatio || 1;
  var tmCount2 = Object.keys(teammates).length;
  var totalSlots2 = 1 + tmCount2;
  var slotH3 = Math.floor(H * dpr / totalSlots2);
  var mySlotY2 = (totalSlots2 - 1) * slotH3;
  var mySC2 = Math.min(W * dpr / 320, slotH3 / 180);

  // Draw my countdown view in my slot (bottom)
  ctx.save();
  ctx.imageSmoothingEnabled = false;
  ctx.beginPath();
  ctx.rect(0, mySlotY2, W * dpr, slotH3);
  ctx.clip();
  var ox = (W * dpr - 320 * mySC2) / 2;
  var oy = mySlotY2 + (slotH3 - 180 * mySC2) / 2;
  ctx.translate(ox, oy);
  ctx.scale(mySC2, mySC2);

  // Jail background
  ctx.fillStyle = "#3a3a50";
  ctx.fillRect(-20, -30, 360, 240);
  ctx.drawImage(IMG.music_rouya, -13, -21, 350, 220);

  var floorTileW = IMG.floor1.width * DO.floor.s;
  for (var x = -floorTileW; x < 340; x += floorTileW) {
    ctx.drawImage(IMG.floor1, DO.floor.x + x, DO.floor.y, floorTileW, IMG.floor1.height * DO.floor.s);
  }

  ctx.drawImage(IMG.door_closed, DO.door.x, DO.door.y, DO.door.w * DO.door.s, DO.door.h * DO.door.s);

  // My character
  var frame = Math.floor(performance.now() / 200) % 2;
  var cdPlayerIdx = 0;
  for (var ci = 0; ci < allPlayers.length; ci++) { if (allPlayers[ci].id === myId) { cdPlayerIdx = ci; break; } }
  var pImg = cdPlayerIdx >= 1
    ? (frame === 0 ? IMG.pri2 : IMG.pri2_2)
    : (frame === 0 ? IMG.prio1 : IMG.prio1_2);
  var pScale = DO.player.s;
  var pW = pImg.width * pScale;
  var pH = pImg.height * pScale;
  ctx.save();
  ctx.shadowColor = "#fff"; ctx.shadowBlur = 3;
  ctx.translate(playerX + pW / 2, (GROUND_Y - pH + 5) + pH / 2);
  ctx.drawImage(pImg, -pW / 2, -pH / 2, pW, pH);
  ctx.restore();

  // Countdown number
  var elapsed = (performance.now() - countdownStart) / 1000;
  var remaining = Math.ceil(3 - elapsed);
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  if (remaining > 0) {
    ctx.fillStyle = "#fff"; ctx.font = "bold 40px sans-serif";
    ctx.shadowColor = "#000"; ctx.shadowBlur = 10;
    ctx.fillText(remaining, 160, 80);
    ctx.shadowBlur = 0;
  } else {
    ctx.fillStyle = "#FFA726"; ctx.font = "bold 30px sans-serif";
    ctx.shadowColor = "#000"; ctx.shadowBlur = 10;
    ctx.fillText("GO!", 160, 80);
    ctx.shadowBlur = 0;
  }

  // YOU label
  if (totalSlots2 > 1) {
    ctx.fillStyle = "#4FC3F7"; ctx.font = "bold 10px sans-serif"; ctx.textAlign = "left";
    ctx.fillText("YOU - " + myId, 8, 168);
  }

  ctx.restore();

  // Draw teammate views in top slots (same jail scene, waiting)
  drawTeammateViews();
}

function renderResult() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.save();
  ctx.imageSmoothingEnabled = false;
  var dpr = window.devicePixelRatio || 1;
  var ox = (W * dpr - 320 * SC) / 2;
  var oy = (H * dpr - 180 * SC) / 2;
  ctx.translate(ox, oy);
  ctx.scale(SC, SC);

  teamScore = score;
  for (var k in playerScores) teamScore += playerScores[k].score;
  var isWin = hp > 0 && teamScore >= ESCAPE_SCORE;
  ctx.drawImage(isWin ? IMG.win : IMG.lose, 0, 0, 320, 180);

  ctx.textAlign = "center"; ctx.fillStyle = "#fff";
  ctx.font = "bold 12px sans-serif";
  ctx.fillText("TEAM SCORE: " + teamScore, 160, 130);
  ctx.font = "9px sans-serif";
  ctx.fillText("MY: " + score + " | COMBO: " + maxCombo + " | DODGE: " + dodgeCount, 160, 145);
  var ry = 157;
  for (var pid in playerScores) {
    ctx.fillText(playerScores[pid].name + ": " + playerScores[pid].score + "pts", 160, ry);
    ry += 11;
  }
  ctx.restore();
}

function startCountdown() {
  phase = "countdown";
  countdownStart = performance.now();
  document.getElementById("wait-msg").style.display = "none";
  // BGM starts when board is drawn (not waiting for GO)
  bgm = new Audio("assets/bgm.mp3");
  bgm.loop = true;
  bgm.play().catch(function() {});
  setTimeout(function() { startPlaying(); }, 3500);
}

function startPlaying() {
  phase = "playing";
  hp = HP_MAX; score = 0; combo = 0; maxCombo = 0; dodgeCount = 0;
  ghostSpeed = GHOST_SPEED_INIT;
  playerY = GROUND_Y; playerVY = 0; isJumping = false;
  ghosts = []; ghostCooldown = 2500; scrollX = 0;
  gameStart = performance.now();
  // BGM already playing from countdown
  setTimeout(function() { if (phase === "playing") spawnGhost(true); }, 2000);
}

function startGame() { startCountdown(); }

function endGame() {
  phase = "result";
  if (bgm) { bgm.pause(); bgm = null; }
  broadcastState();
}

function broadcastState() {
  if (!channel) return;
  var myIdx3 = 0;
  for (var j = 0; j < allPlayers.length; j++) { if (allPlayers[j].id === myId) { myIdx3 = j; break; } }
  channel.send({ type: "broadcast", event: "jailbreak_state", payload: {
    playerId: myId, score: score, hp: hp, combo: combo, maxCombo: maxCombo,
    dodgeCount: dodgeCount, isP2: myIdx3 >= 1
  }});
}
function checkAllReady() {
  if (phase !== "syncing") return;
  var otherCount = allPlayers.length - 1;
  var tmCount = Object.keys(teammates).length;
  if (otherCount <= 0 || tmCount >= otherCount) {
    // All teammates registered — start!
    phase = "allready";
    document.getElementById("wait-msg").innerHTML = '<div style="font-size:24px;">全員揃った！</div>';
    setTimeout(function() { startGame(); }, 1000);
  }
}

function broadcastJump() {
  if (!channel) return;
  channel.send({ type: "broadcast", event: "jailbreak_jump", payload: { playerId: myId } });
}
function broadcastHit() {
  if (!channel) return;
  channel.send({ type: "broadcast", event: "jailbreak_hit", payload: { playerId: myId, hp: hp, dead: hp <= 0 } });
}

function loop(ts) {
  requestAnimationFrame(loop);
  var dt = ts - (lastFrame || ts);
  lastFrame = ts;
  if (phase === "syncing" || phase === "allready") { renderCountdown(); }
  else if (phase === "countdown") { renderCountdown(); }
  else if (phase === "playing") {
    if (!debugMode) update(dt);
    render();
    if (debugMode) drawDebugOverlay();
  } else if (phase === "result") { renderResult(); }
}

var roomInfo = document.getElementById("room-info");
var nameInput = document.getElementById("name-input");
var joinBtn = document.getElementById("join-btn");
var hostParam = params.get("host");

roomInfo.textContent = roomId ? "Room: " + roomId : "URL に ?room=XXXX が必要";
nameInput.addEventListener("input", function() { joinBtn.disabled = !nameInput.value.trim(); });
nameInput.addEventListener("keydown", function(e) { if (e.key === "Enter" && nameInput.value.trim()) joinBtn.click(); });

if (hostParam && roomId) {
  nameInput.value = decodeURIComponent(hostParam);
  joinBtn.disabled = false;
  setTimeout(function() { joinBtn.click(); }, 300);
}

joinBtn.addEventListener("click", function() {
  myId = nameInput.value.trim();
  if (!myId || !roomId) return;
  document.getElementById("join-screen").style.display = "none";
  document.getElementById("wait-msg").style.display = "flex";

  var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  channel = sb.channel("room-" + roomId, { config: { broadcast: { self: true } } });

  channel.on("broadcast", { event: "jailbreak_ghost" }, function(msg) {
    var d = (msg && msg.payload) ? msg.payload : msg;
    if (d.fromId !== myId && phase === "playing") {
      if (!d.targetId || d.targetId === myId) {
        // Ghost targeted at me — spawn from same direction as relay
        var ghostDir = d.fromRight != null ? d.fromRight : true;
        spawnGhost(ghostDir, d.speed || ghostSpeed, d.relayCount || 0);
        if (d.combo) sharedCombo = d.combo;
      }
      // Also show ghost spawning on the target teammate's local sim
      if (d.targetId && d.targetId !== myId && teammates[d.targetId]) {
        var tgDir = d.fromRight ? -1 : 1;
        var tgX = d.fromRight ? 340 : -30;
        teammates[d.targetId].ghosts.push({ x: tgX, speed: d.speed || ghostSpeed, dir: tgDir, active: true });
      }
    }
    if (d.fromId === myId && d.targetId && teammates[d.targetId]) {
      var tgDir2 = d.fromRight ? -1 : 1;
      var tgX2 = d.fromRight ? 340 : -30;
      teammates[d.targetId].ghosts.push({ x: tgX2, speed: d.speed || ghostSpeed, dir: tgDir2, active: true });
    }
  });

  // Teammate jump → make their local sim jump
  channel.on("broadcast", { event: "jailbreak_jump" }, function(msg) {
    var d = (msg && msg.payload) ? msg.payload : msg;
    if (d.playerId && d.playerId !== myId && teammates[d.playerId]) {
      var tm = teammates[d.playerId];
      if (!tm.isJumping) { tm.playerVY = JUMP_FORCE; tm.isJumping = true; }
    }
  });

  // Teammate hit → start their knockback anim
  channel.on("broadcast", { event: "jailbreak_hit" }, function(msg) {
    var d = (msg && msg.payload) ? msg.payload : msg;
    if (d.playerId && d.playerId !== myId && teammates[d.playerId]) {
      var tm = teammates[d.playerId];
      tm.hp = d.hp;
      tm.hitAnim = { phase: "spin_up", timer: 0, spinAngle: 0, vy: -12, dead: d.dead };
      tm.playerVY = 0; tm.isJumping = true;
    }
  });

  channel.on("broadcast", { event: "jailbreak_shield" }, function(msg) {
    var d = (msg && msg.payload) ? msg.payload : msg;
    if (d.targetId === myId) {
      hasShield = true;
    }
  });

  channel.on("broadcast", { event: "jailbreak_combo_break" }, function(msg) {
    var d = (msg && msg.payload) ? msg.payload : msg;
    if (d.fromId !== myId) { sharedCombo = 0; }
  });

  channel.on("broadcast", { event: "jailbreak_state" }, function(msg) {
    var d = (msg && msg.payload) ? msg.payload : msg;
    if (d.playerId && d.playerId !== myId) {
      playerScores[d.playerId] = { score: d.score || 0, hp: d.hp != null ? d.hp : HP_MAX, name: d.playerId };
      // Init teammate local sim if not exists
      if (!teammates[d.playerId]) {
        // Determine player index from allPlayers order
        var pIdx = -1;
        for (var pi2 = 0; pi2 < allPlayers.length; pi2++) { if (allPlayers[pi2].id === d.playerId) { pIdx = pi2; break; } }
        teammates[d.playerId] = {
          playerY: GROUND_Y, playerVY: 0, isJumping: false,
          ghosts: [], hp: d.hp || HP_MAX, combo: d.combo || 0,
          isP2: pIdx >= 1, hitAnim: null, name: d.playerId
        };
      }
      teammates[d.playerId].hp = d.hp;
      teammates[d.playerId].combo = d.combo || 0;
      teammates[d.playerId].name = d.playerId;
      if (phase === "syncing") checkAllReady();
      // If game already started and we're still waiting, catch up
      if ((phase === "waiting") && d.score > 0) {
        startGame();
      }
      teamScore = score;
      for (var k in playerScores) teamScore += playerScores[k].score;
      for (var k2 in playerScores) {
        if (playerScores[k2].hp <= 0 && phase === "playing") { endGame(); return; }
      }
    }
  });

  channel.on("broadcast", { event: "jailbreak_start" }, function() {
    if (phase === "waiting") {
      phase = "syncing";
      document.getElementById("wait-msg").innerHTML = '<div>全員の接続を確認中…</div>';
      broadcastState();
      checkAllReady();
      // Keep broadcasting until all ready
      var clientSyncPoll = setInterval(function() {
        if (phase !== "syncing") { clearInterval(clientSyncPoll); return; }
        broadcastState();
        checkAllReady();
      }, 500);
    }
  });

  channel.on("broadcast", { event: "jailbreak_join" }, function(msg) {
    var d = (msg && msg.payload) ? msg.payload : msg;
    if (d.playerId) {
      var found = false;
      for (var i = 0; i < allPlayers.length; i++) { if (allPlayers[i].id === d.playerId) { found = true; break; } }
      if (!found) {
        allPlayers.push({ id: d.playerId });
        // Init teammate sim for non-self players
        if (d.playerId !== myId) {
          var tmIdx = allPlayers.length - 1;
          teammates[d.playerId] = {
            playerY: GROUND_Y, playerVY: 0, isJumping: false,
            ghosts: [], hp: HP_MAX, combo: 0,
            isP2: tmIdx >= 1, hitAnim: null, name: d.playerId
          };
        }
      }
    }
  });

  channel.subscribe(function(status) {
    if (status === "SUBSCRIBED") {
      phase = "waiting";
      allPlayers.push({ id: myId });
      channel.send({ type: "broadcast", event: "join", payload: { playerId: myId, name: myId } });
      channel.send({ type: "broadcast", event: "jailbreak_join", payload: { playerId: myId } });
      if (hostParam) {
        setTimeout(function() {
          if (phase === "waiting") {
            channel.send({ type: "broadcast", event: "jailbreak_start", payload: {} });
            // Host also enters sync phase
            phase = "syncing";
            document.getElementById("wait-msg").innerHTML = '<div>全員の接続を確認中…</div>';
            broadcastState();
            checkAllReady();
            // Keep broadcasting until all ready
            var syncPoll = setInterval(function() {
              if (phase !== "syncing") { clearInterval(syncPoll); return; }
              broadcastState();
              checkAllReady();
            }, 500);
          }
        }, 2000);
      }
    }
  });
});

loadImages(function() { requestAnimationFrame(loop); });
</script>
