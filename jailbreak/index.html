<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>JailBreakers</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#222;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;}
#join-screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#1a1a2e;z-index:100;font-family:sans-serif;}
#join-screen h1{color:#fff;margin-bottom:8px;}
#join-screen .sub{color:#aaa;font-size:13px;margin-bottom:20px;}
#join-screen input{padding:10px 16px;font-size:16px;border-radius:8px;border:none;width:200px;text-align:center;margin-bottom:12px;}
#join-screen button{padding:10px 32px;font-size:16px;border-radius:8px;border:none;background:#FFA726;color:#000;cursor:pointer;font-weight:bold;}
#join-screen button:disabled{opacity:0.4;}
#wait-msg{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#1a1a2e;z-index:90;color:#fff;font-family:sans-serif;font-size:18px;flex-direction:column;}
</style>
</head>
<body>
<div id="join-screen">
  <h1>👻 JailBreakers</h1>
  <div class="sub" id="room-info"></div>
  <input id="name-input" type="text" placeholder="名前を入力" maxlength="10">
  <br><button id="join-btn" disabled>参加</button>
</div>
<div id="wait-msg"><div>対戦相手を待っています…</div><div style="font-size:13px;color:#aaa;margin-top:8px;">ホストが「ゲームスタート」を押すと始まります</div></div>
<canvas id="c"></canvas>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const params = new URLSearchParams(location.search)
const roomId = params.get('room')

const SUPABASE_URL = 'https://eixvkfbdplxgpypxjtml.supabase.co'
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVpeHZrZmJkcGx4Z3B5cHhqdG1sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQzMjI5NjksImV4cCI6MjA3OTg5ODk2OX0.vmSeqMS6DQW_gFk9rIhq2lj_x9RTgncBFfhSb9_i0y8'

// ===== Assets =====
const IMG = {}
const imgList = ['music_rouya','floor1','prio1','prio1_2','pri2','pri2_2','obake','toge','door_closed','door_open','win','lose','exclamation']
let loaded = 0

function loadImages(cb) {
  for (const n of imgList) {
    const img = new Image()
    img.onload = () => { loaded++; if (loaded >= imgList.length) cb() }
    img.onerror = () => { loaded++; if (loaded >= imgList.length) cb() }
    img.src = `assets/${n}.png`
    IMG[n] = img
  }
}

// ===== Canvas =====
const canvas = document.getElementById('c')
const ctx = canvas.getContext('2d')
let W, H, SC

function resize() {
  W = innerWidth; H = innerHeight
  const dpr = window.devicePixelRatio || 1
  canvas.width = W * dpr; canvas.height = H * dpr
  canvas.style.width = W + 'px'
  canvas.style.height = H + 'px'
  SC = Math.min(W / 320, H / 180) * dpr
}
resize()
addEventListener('resize', resize)

// ===== Game Constants =====
const GROUND_Y = 140
const GRAVITY = 0.6
const JUMP_FORCE = -8
const GHOST_SPEED_INIT = 2.5
const GHOST_SPEED_ACCEL = 0.05 // per successful dodge
const GAME_DURATION = 60 // seconds
const HP_MAX = 5
const ESCAPE_SCORE = 5000 // co-op score to escape

// ===== Game State =====
let phase = 'join' // join, waiting, playing, result
let myId = null
let channel = null
let allPlayers = [] // [{id, name}]
let myIndex = -1 // 0=P1, 1=P2

// Player state
let playerX = 60
let playerY = GROUND_Y
let playerVY = 0
let isJumping = false
let hp = HP_MAX
let score = 0
let combo = 0
let maxCombo = 0
let dodgeCount = 0

// Hit animation state
let hitAnim = null // { phase, timer, spinAngle, peakY, dead }
// phase: 'spin_up' → 'fall' → 'land' (or 'buried' if dead)

// Ghost state
let ghosts = [] // [{x, speed, active}]
let ghostSpeed = GHOST_SPEED_INIT
let ghostCooldown = 0

// Timing
let gameStart = 0
let bgm = null
let lastFrame = 0
let animFrame = 0

// Opponent state (received via broadcast)
let opponentScore = 0
let opponentHP = HP_MAX
let opponentName = '相棒'
let teamScore = 0 // combined co-op score
let sharedCombo = 0 // breaks if either player misses
const playerScores = {} // id -> {score, hp, name}

// ===== Input =====
function jump() {
  if (phase !== 'playing') return
  if (hitAnim) return // can't jump during hit animation
  if (!isJumping) {
    playerVY = JUMP_FORCE
    isJumping = true
  }
}

canvas.addEventListener('pointerdown', (e) => { e.preventDefault(); jump() })
addEventListener('keydown', (e) => {
  if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w') { e.preventDefault(); jump() }
})

// ===== Ghost Management =====
function spawnGhost(fromRight = true, speed) {
  ghosts.push({
    x: fromRight ? 330 : -30,
    speed: speed || ghostSpeed,
    dir: fromRight ? -1 : 1,
    active: true,
    hit: false,
  })
}

function sendGhostToOpponent() {
  if (!channel) return
  dodgeCount++
  ghostSpeed = GHOST_SPEED_INIT + dodgeCount * GHOST_SPEED_ACCEL
  combo++
  sharedCombo++
  if (combo > maxCombo) maxCombo = combo
  // Co-op scoring: combo multiplier rewards teamwork
  const pts = 100 + sharedCombo * 20
  score += pts

  // Send ghost to NEXT player in order (1P→2P→3P→1P...)
  const myIdx = allPlayers.findIndex(p => p.id === myId)
  const nextIdx = (myIdx + 1) % allPlayers.length
  const targetId = allPlayers.length > 1 ? allPlayers[nextIdx].id : null
  channel.send({
    type: 'broadcast',
    event: 'jailbreak_ghost',
    payload: { fromId: myId, targetId, speed: ghostSpeed, combo: sharedCombo },
  })
  broadcastState()
}

// ===== Update =====
function update(dt) {
  if (phase !== 'playing') return

  const elapsed = (performance.now() - gameStart) / 1000

  // Hit animation physics
  if (hitAnim) {
    hitAnim.timer += dt
    hitAnim.spinAngle += 0.4 // fast spin

    if (hitAnim.phase === 'spin_up') {
      hitAnim.vy += 0.15 // slow gravity during rise
      playerY += hitAnim.vy
      if (hitAnim.vy > 0) {
        hitAnim.phase = 'fall'
      }
    } else if (hitAnim.phase === 'fall') {
      hitAnim.vy += 0.4 // normal gravity
      playerY += hitAnim.vy
      if (playerY >= GROUND_Y) {
        if (hitAnim.dead) {
          // Head buried in ground!
          hitAnim.phase = 'buried'
          playerY = GROUND_Y + 10 // partially underground
          hitAnim.spinAngle = Math.PI // upside down
          setTimeout(() => endGame(), 1500)
        } else {
          // Normal landing — bounce a little
          hitAnim.phase = 'land'
          playerY = GROUND_Y
          hitAnim.vy = -3 // small bounce
        }
      }
    } else if (hitAnim.phase === 'land') {
      hitAnim.vy += 0.5
      playerY += hitAnim.vy
      hitAnim.spinAngle *= 0.9 // slow down spin
      if (playerY >= GROUND_Y) {
        playerY = GROUND_Y
        hitAnim = null // animation done, back to normal
        isJumping = false
      }
    }
    // buried phase: just stay stuck
    return // skip normal physics during hit anim
  }

  // Normal player physics
  playerVY += GRAVITY
  playerY += playerVY
  if (playerY >= GROUND_Y) {
    playerY = GROUND_Y
    playerVY = 0
    isJumping = false
  }

  // Ghost cooldown for auto-spawn (if no opponent connected, self-play)
  ghostCooldown -= dt
  if (ghosts.length === 0 && ghostCooldown <= 0 && allPlayers.length < 2) {
    spawnGhost(true)
    ghostCooldown = 2000 / (1 + dodgeCount * 0.1)
  }

  // Update ghosts
  for (const g of ghosts) {
    if (!g.active) continue
    g.x += g.dir * g.speed

    // Check collision with player (skip during hit animation)
    const ghostX = g.x
    const isNear = Math.abs(ghostX - playerX) < 15
    if (hitAnim) continue // invincible during knockback

    if (isNear && !g.hit) {
      if (playerY < GROUND_Y - 10) {
        // Dodged! Send to opponent
        g.hit = true
        g.active = false
        sendGhostToOpponent()
        broadcastState()
      } else if (!hitAnim) {
        // Hit! Start knockback animation
        g.hit = true
        g.active = false
        hp--
        combo = 0
        sharedCombo = 0
        broadcastState()
        if (channel) channel.send({
          type: 'broadcast', event: 'jailbreak_combo_break',
          payload: { fromId: myId },
        })

        // Launch player spinning upward
        hitAnim = {
          phase: 'spin_up',
          timer: 0,
          spinAngle: 0,
          vy: -12,         // strong upward launch
          dead: hp <= 0,
        }
        playerVY = 0
        isJumping = true
      }
    }

    // Off screen
    if (g.x < -40 || g.x > 340) g.active = false
  }
  ghosts = ghosts.filter(g => g.active)

  // Win: team score reached escape threshold
  teamScore = score
  for (const p of Object.values(playerScores || {})) teamScore += (p?.score || 0)
  if (teamScore >= ESCAPE_SCORE) {
    endGame()
    return
  }

  // Time up
  if (elapsed >= GAME_DURATION) {
    endGame()
  }

  // Auto-spawn for single player
  if (allPlayers.length < 2 && ghosts.length === 0 && ghostCooldown <= 0) {
    spawnGhost(true)
    ghostCooldown = Math.max(500, 2000 - dodgeCount * 50)
  }
}

// ===== Render =====
function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height)
  ctx.save()
  ctx.imageSmoothingEnabled = false
  const dpr = window.devicePixelRatio || 1
  const ox = (W * dpr - 320 * SC) / 2
  const oy = (H * dpr - 180 * SC) / 2
  ctx.translate(ox, oy)
  ctx.scale(SC, SC)

  // Background
  ctx.drawImage(IMG.music_rouya, 0, 0, 320, 180)

  // Floor
  for (let x = 0; x < 320; x += IMG.floor1.width) {
    ctx.drawImage(IMG.floor1, x, 152)
  }

  const now = performance.now()
  const elapsed = (now - gameStart) / 1000
  const frame = Math.floor(now / 200) % 2

  // Door + escape meter (co-op: team score fills meter)
  teamScore = score + opponentScore
  const escapeProgress = Math.min(teamScore / ESCAPE_SCORE, 1)
  ctx.drawImage(escapeProgress >= 1 ? IMG.door_open : IMG.door_closed, 285, 90, 25, 50)

  // Player (with spin animation)
  const pImg = (hitAnim && hitAnim.phase === 'buried') ? IMG.prio1 : (frame === 0 ? IMG.prio1 : IMG.prio1_2)
  const pScale = 5
  const pW = pImg.width * pScale
  const pH = pImg.height * pScale
  const pDrawX = playerX
  const pDrawY = playerY - pH + 15

  ctx.save()
  if (hitAnim) {
    const cx = pDrawX + pW / 2
    const cy = pDrawY + pH / 2
    ctx.translate(cx, cy)
    ctx.rotate(hitAnim.spinAngle)

    if (hitAnim.phase === 'buried') {
      // Head stuck in ground — draw upside down, half clipped
      ctx.drawImage(pImg, -pW / 2, -pH / 2, pW, pH)
      // Stars around head
      const st = performance.now() / 200
      for (let i = 0; i < 3; i++) {
        const sa = st + i * 2.1
        ctx.fillStyle = '#FFD740'
        ctx.font = '8px sans-serif'
        ctx.fillText('⭐', Math.cos(sa) * 12 - 4, Math.sin(sa) * 8 - pH / 2)
      }
    } else {
      // Spinning
      ctx.globalAlpha = hitAnim.dead ? 0.7 : 1
      ctx.drawImage(pImg, -pW / 2, -pH / 2, pW, pH)
      ctx.globalAlpha = 1
    }
  } else {
    ctx.translate(pDrawX + pW / 2, pDrawY + pH / 2)
    ctx.drawImage(pImg, -pW / 2, -pH / 2, pW, pH)
  }
  ctx.restore()

  // Ghosts
  for (const g of ghosts) {
    if (!g.active) continue
    const gScale = 4
    ctx.drawImage(IMG.obake, g.x - 8 * gScale, GROUND_Y - IMG.obake.height * gScale + 15, IMG.obake.width * gScale, IMG.obake.height * gScale)
  }

  // HP hearts
  ctx.font = '12px sans-serif'
  for (let i = 0; i < HP_MAX; i++) {
    ctx.fillText(i < hp ? '❤️' : '🖤', 8 + i * 16, 20)
  }

  // Timer bar
  const timeLeft = Math.max(0, GAME_DURATION - elapsed)
  ctx.fillStyle = '#333'
  ctx.fillRect(8, 26, 120, 6)
  ctx.fillStyle = timeLeft < 10 ? '#f44' : '#4CAF50'
  ctx.fillRect(8, 26, (timeLeft / GAME_DURATION) * 120, 6)

  // Escape meter (co-op)
  ctx.fillStyle = '#333'
  ctx.fillRect(140, 4, 170, 8)
  ctx.fillStyle = escapeProgress >= 1 ? '#4CAF50' : '#FFA726'
  ctx.fillRect(140, 4, escapeProgress * 170, 8)
  ctx.strokeStyle = '#fff'
  ctx.lineWidth = 0.5
  ctx.strokeRect(140, 4, 170, 8)
  ctx.fillStyle = '#fff'
  ctx.font = '6px monospace'
  ctx.textAlign = 'center'
  ctx.fillText(`ESCAPE ${Math.floor(escapeProgress * 100)}%`, 225, 10)

  // My score
  ctx.textAlign = 'right'
  ctx.font = 'bold 9px monospace'
  ctx.fillStyle = '#fff'
  ctx.fillText(`MY: ${score}`, 312, 20)
  ctx.fillText(`TEAM: ${teamScore}`, 312, 30)

  // Shared combo
  if (sharedCombo > 1) {
    ctx.fillStyle = '#FFD740'
    ctx.font = 'bold 16px sans-serif'
    ctx.textAlign = 'center'
    ctx.fillText(`🔥 ${sharedCombo} RALLY!`, 160, 80)
  }

  // Teammates
  ctx.textAlign = 'left'
  ctx.font = '7px monospace'
  let sy = 40
  for (const [pid, p] of Object.entries(playerScores)) {
    ctx.fillStyle = p.hp > 0 ? '#8f8' : '#f44'
    ctx.fillText(`${p.name}: ${p.score}pts ${'❤️'.repeat(Math.max(0,p.hp))}`, 8, sy)
    sy += 10
  }

  // Jump instruction
  if (elapsed < 5) {
    ctx.textAlign = 'center'
    ctx.fillStyle = '#FFD740'
    ctx.font = 'bold 12px sans-serif'
    ctx.fillText('タップ or スペースでジャンプ！', 160, 110)
  }

  ctx.restore()
}

function renderResult() {
  ctx.clearRect(0, 0, canvas.width, canvas.height)
  ctx.save()
  ctx.imageSmoothingEnabled = false
  const dpr = window.devicePixelRatio || 1
  const ox = (W * dpr - 320 * SC) / 2
  const oy = (H * dpr - 180 * SC) / 2
  ctx.translate(ox, oy)
  ctx.scale(SC, SC)

  teamScore = score
  for (const p of Object.values(playerScores)) teamScore += p.score
  const isWin = hp > 0 && teamScore >= ESCAPE_SCORE
  ctx.drawImage(isWin ? IMG.win : IMG.lose, 0, 0, 320, 180)

  ctx.textAlign = 'center'
  ctx.fillStyle = '#fff'
  ctx.font = 'bold 12px sans-serif'
  ctx.fillText(`TEAM SCORE: ${teamScore}`, 160, 130)
  ctx.font = '9px sans-serif'
  ctx.fillText(`MY: ${score} | COMBO: ${maxCombo} | DODGE: ${dodgeCount}`, 160, 145)
  let ry = 157
  for (const [pid, p] of Object.entries(playerScores)) {
    ctx.fillText(`${p.name}: ${p.score}pts`, 160, ry)
    ry += 11
  }

  ctx.restore()
}

// ===== Game Flow =====
function startGame() {
  phase = 'playing'
  hp = HP_MAX
  score = 0; combo = 0; maxCombo = 0; dodgeCount = 0
  ghostSpeed = GHOST_SPEED_INIT
  playerY = GROUND_Y; playerVY = 0; isJumping = false
  ghosts = []; ghostCooldown = 1500
  gameStart = performance.now()

  document.getElementById('wait-msg').style.display = 'none'

  bgm = new Audio('assets/bgm.mp3')
  bgm.loop = true
  bgm.play().catch(() => {})

  // First ghost after 2 sec
  setTimeout(() => { if (phase === 'playing') spawnGhost(true) }, 2000)
}

function endGame() {
  phase = 'result'
  if (bgm) { bgm.pause(); bgm = null }
  broadcastState()
}

function broadcastState() {
  if (!channel) return
  channel.send({
    type: 'broadcast', event: 'jailbreak_state',
    payload: { playerId: myId, score, hp, combo, maxCombo, dodgeCount },
  })
}

// ===== Main Loop =====
function loop(ts) {
  requestAnimationFrame(loop)
  const dt = ts - (lastFrame || ts)
  lastFrame = ts

  if (phase === 'playing') {
    update(dt)
    render()
  } else if (phase === 'result') {
    renderResult()
  }
}

// ===== Join =====
const roomInfo = document.getElementById('room-info')
const nameInput = document.getElementById('name-input')
const joinBtn = document.getElementById('join-btn')

const hostParam = params.get('host')
roomInfo.textContent = roomId ? `Room: ${roomId}` : 'URL に ?room=XXXX が必要'
nameInput.addEventListener('input', () => { joinBtn.disabled = !nameInput.value.trim() })
nameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter' && nameInput.value.trim()) joinBtn.click() })

// Host auto-join
if (hostParam && roomId) {
  nameInput.value = decodeURIComponent(hostParam)
  joinBtn.disabled = false
  setTimeout(() => joinBtn.click(), 300)
}

joinBtn.addEventListener('click', () => {
  myId = nameInput.value.trim()
  if (!myId || !roomId) return
  document.getElementById('join-screen').style.display = 'none'
  document.getElementById('wait-msg').style.display = 'flex'

  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
  channel = sb.channel(`room-${roomId}`, { config: { broadcast: { self: true } } })

  channel.on('broadcast', { event: 'jailbreak_ghost' }, (msg) => {
    const d = msg?.payload ?? msg
    // Accept if targeted at me, or if no target specified (2-player fallback)
    if (d.fromId !== myId && phase === 'playing' && (!d.targetId || d.targetId === myId)) {
      spawnGhost(true, d.speed || ghostSpeed)
      if (d.combo) sharedCombo = d.combo
    }
  })

  channel.on('broadcast', { event: 'jailbreak_combo_break' }, (msg) => {
    const d = msg?.payload ?? msg
    if (d.fromId !== myId) {
      sharedCombo = 0 // partner missed, combo reset
    }
  })

  channel.on('broadcast', { event: 'jailbreak_state' }, (msg) => {
    const d = msg?.payload ?? msg
    if (d.playerId && d.playerId !== myId) {
      playerScores[d.playerId] = { score: d.score || 0, hp: d.hp ?? HP_MAX, name: d.playerId }
      // Team score = sum of all players
      teamScore = score
      for (const p of Object.values(playerScores)) teamScore += p.score
      // Check if ANY teammate is dead → game over for all
      for (const p of Object.values(playerScores)) {
        if (p.hp <= 0 && phase === 'playing') { endGame(); return }
      }
    }
  })

  channel.on('broadcast', { event: 'jailbreak_start' }, () => {
    if (phase === 'waiting') startGame()
  })

  channel.on('broadcast', { event: 'jailbreak_join' }, (msg) => {
    const d = msg?.payload ?? msg
    if (d.playerId && !allPlayers.find(p => p.id === d.playerId)) {
      allPlayers.push({ id: d.playerId })
    }
  })

  channel.subscribe((status) => {
    if (status === 'SUBSCRIBED') {
      phase = 'waiting'
      allPlayers.push({ id: myId })
      channel.send({ type: 'broadcast', event: 'join', payload: { playerId: myId, name: myId } })
      channel.send({ type: 'broadcast', event: 'jailbreak_join', payload: { playerId: myId } })

      // Host auto-starts after 2 seconds (gives clients time to receive)
      if (hostParam) {
        setTimeout(() => {
          if (phase === 'waiting') {
            channel.send({ type: 'broadcast', event: 'jailbreak_start', payload: {} })
            startGame()
          }
        }, 2000)
      }
    }
  })
})

// ===== Init =====
loadImages(() => { requestAnimationFrame(loop) })
</script>
</body>
</html>
