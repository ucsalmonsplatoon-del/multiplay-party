<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>JailBreakers</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#222;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;}
#ui{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10;}
#join-screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#1a1a2e;z-index:100;}
#join-screen h1{color:#fff;font-family:sans-serif;margin-bottom:20px;}
#join-screen input{padding:10px 16px;font-size:16px;border-radius:8px;border:none;width:200px;text-align:center;margin-bottom:12px;}
#join-screen button{padding:10px 32px;font-size:16px;border-radius:8px;border:none;background:#FFA726;color:#000;cursor:pointer;}
#join-screen button:disabled{opacity:0.4;}
</style>
</head>
<body>
<div id="join-screen">
  <h1>🔓 JailBreakers</h1>
  <p style="color:#aaa;font-family:sans-serif;margin-bottom:16px;" id="room-info"></p>
  <input id="name-input" type="text" placeholder="名前を入力" maxlength="10">
  <br><button id="join-btn" disabled>参加</button>
</div>
<canvas id="c"></canvas>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const params = new URLSearchParams(location.search)
const roomId = params.get('room')

const SUPABASE_URL = 'https://eixvkfbdplxgpypxjtml.supabase.co'
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVpeHZrZmJkcGx4Z3B5cHhqdG1sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQzMjI5NjksImV4cCI6MjA3OTg5ODk2OX0.vmSeqMS6DQW_gFk9rIhq2lj_x9RTgncBFfhSb9_i0y8'

// ===== Assets =====
const IMG = {}
const imgNames = ['music_rouya','door_closed','door_open','floor1','prio1','prio1_2','pri2','pri2_2','toge','win','lose','exclamation','pressA','logo']
let loadCount = 0

function loadImages(cb) {
  for (const name of imgNames) {
    const img = new Image()
    img.onload = () => { loadCount++; if (loadCount >= imgNames.length) cb() }
    img.src = `assets/${name}.png`
    IMG[name] = img
  }
}

// ===== Canvas =====
const canvas = document.getElementById('c')
const ctx = canvas.getContext('2d')
let W, H, SCALE

function resize() {
  W = window.innerWidth; H = window.innerHeight
  canvas.width = W; canvas.height = H
  SCALE = Math.min(W / 320, H / 180)
}
resize()
window.addEventListener('resize', resize)

// ===== Game State =====
const BPM = 150
const BEAT_MS = 60000 / BPM
const TOTAL_BEATS = 80 // ~32 seconds at 150bpm
const ESCAPE_THRESHOLD = 60 // need 60 good hits to escape

let gamePhase = 'waiting' // waiting, playing, result
let myId = null
let channel = null
let players = {} // id -> { name, score, combo, maxCombo }
let beatIndex = 0
let musicStart = 0
let bgm = null
let notes = [] // { beat, hit, miss }
let myScore = 0
let myCombo = 0
let myMaxCombo = 0
let totalScore = 0
let lastHitTime = 0
let hitFeedback = '' // 'perfect','good','miss'
let hitFeedbackTime = 0
let doorOpen = false
let gameResult = null // 'win','lose'

// Generate note pattern (every beat, some rests)
function generateNotes() {
  notes = []
  for (let i = 0; i < TOTAL_BEATS; i++) {
    // Some beats are rests (every 8th beat)
    if (i % 8 === 7) continue
    notes.push({ beat: i, hit: false, miss: false })
  }
}

// ===== Input =====
let tapActive = false

function onTap() {
  if (gamePhase !== 'playing') return
  const now = performance.now()
  const elapsed = now - musicStart
  const currentBeat = elapsed / BEAT_MS

  // Find closest unhit note
  let closest = null
  let closestDist = 999
  for (const n of notes) {
    if (n.hit || n.miss) continue
    const dist = Math.abs(n.beat - currentBeat)
    if (dist < closestDist) { closestDist = dist; closest = n }
  }

  if (closest && closestDist < 0.4) {
    closest.hit = true
    if (closestDist < 0.15) {
      myScore += 100
      hitFeedback = 'PERFECT!'
    } else {
      myScore += 50
      hitFeedback = 'GOOD'
    }
    myCombo++
    if (myCombo > myMaxCombo) myMaxCombo = myCombo
    hitFeedbackTime = now
    lastHitTime = now

    // Broadcast score
    broadcastScore()
  } else {
    hitFeedback = 'MISS'
    hitFeedbackTime = now
    myCombo = 0
  }
}

canvas.addEventListener('pointerdown', (e) => { e.preventDefault(); onTap() })
document.addEventListener('keydown', (e) => {
  if (e.key === ' ' || e.key === 'a' || e.key === 'j') { e.preventDefault(); onTap() }
})

// ===== Supabase Sync =====
function broadcastScore() {
  if (!channel) return
  channel.send({
    type: 'broadcast', event: 'jailbreak_score',
    payload: { playerId: myId, score: myScore, combo: myCombo, maxCombo: myMaxCombo }
  })
}

// ===== Rendering =====
function drawGame() {
  ctx.clearRect(0, 0, W, H)
  ctx.save()

  // Center and scale
  const ox = (W - 320 * SCALE) / 2
  const oy = (H - 180 * SCALE) / 2
  ctx.translate(ox, oy)
  ctx.scale(SCALE, SCALE)

  // Background - jail
  ctx.drawImage(IMG.music_rouya, 0, 0, 320, 180)

  // Floor
  for (let x = 0; x < 320; x += IMG.floor1.width) {
    ctx.drawImage(IMG.floor1, x, 150)
  }

  const now = performance.now()
  const elapsed = now - musicStart
  const currentBeat = elapsed / BEAT_MS

  // Door
  const progress = myScore / (ESCAPE_THRESHOLD * 80)
  ctx.drawImage(progress >= 1 ? IMG.door_open : IMG.door_closed, 280, 80, 30, 60)

  // Progress bar (escape meter)
  ctx.fillStyle = '#333'
  ctx.fillRect(10, 8, 200, 12)
  ctx.fillStyle = progress >= 1 ? '#4CAF50' : '#FFA726'
  ctx.fillRect(10, 8, Math.min(progress, 1) * 200, 12)
  ctx.strokeStyle = '#fff'
  ctx.lineWidth = 0.5
  ctx.strokeRect(10, 8, 200, 12)
  ctx.fillStyle = '#fff'
  ctx.font = '8px monospace'
  ctx.fillText(`ESCAPE: ${Math.floor(progress * 100)}%`, 12, 17)

  // Note lane
  const laneY = 120
  const laneW = 240
  const laneX = 40
  const hitZoneX = laneX + 30

  // Hit zone
  ctx.fillStyle = 'rgba(255,255,0,0.15)'
  ctx.fillRect(hitZoneX - 12, laneY - 15, 24, 30)
  ctx.strokeStyle = '#ff0'
  ctx.lineWidth = 1
  ctx.strokeRect(hitZoneX - 12, laneY - 15, 24, 30)

  // Notes
  for (const n of notes) {
    const dx = (n.beat - currentBeat) * 30
    const nx = hitZoneX + dx
    if (nx < laneX - 20 || nx > laneX + laneW + 20) continue
    if (n.hit) continue
    if (n.miss) continue

    // Auto-miss notes that passed
    if (n.beat < currentBeat - 0.5 && !n.hit) {
      n.miss = true
      myCombo = 0
      continue
    }

    // Draw note
    ctx.fillStyle = '#ff4444'
    ctx.beginPath()
    ctx.arc(nx, laneY, 6, 0, Math.PI * 2)
    ctx.fill()
    ctx.strokeStyle = '#fff'
    ctx.lineWidth = 0.5
    ctx.stroke()
  }

  // Player sprites (animated)
  const frame = Math.floor(now / 200) % 2
  const p1img = frame === 0 ? IMG.prio1 : IMG.prio1_2
  const p2img = frame === 0 ? IMG.pri2 : IMG.pri2_2

  // Player 1 - bounce on hit
  const p1bounce = (now - lastHitTime < 150) ? -4 : 0
  ctx.drawImage(p1img, 60, 130 + p1bounce, 20, 20)

  // Player 2 (if exists)
  const playerIds = Object.keys(players)
  if (playerIds.length > 1) {
    ctx.drawImage(p2img, 90, 130, 20, 20)
  }

  // Combo display
  if (myCombo > 2) {
    ctx.fillStyle = '#FFD740'
    ctx.font = 'bold 14px sans-serif'
    ctx.textAlign = 'center'
    ctx.fillText(`${myCombo} COMBO`, 160, 100)
  }

  // Hit feedback
  if (now - hitFeedbackTime < 400) {
    const alpha = 1 - (now - hitFeedbackTime) / 400
    ctx.globalAlpha = alpha
    ctx.font = 'bold 16px sans-serif'
    ctx.textAlign = 'center'
    if (hitFeedback === 'PERFECT!') {
      ctx.fillStyle = '#FFD740'
    } else if (hitFeedback === 'GOOD') {
      ctx.fillStyle = '#4CAF50'
    } else {
      ctx.fillStyle = '#F44336'
    }
    ctx.fillText(hitFeedback, hitZoneX, laneY - 25)
    ctx.globalAlpha = 1
  }

  // Score
  ctx.textAlign = 'right'
  ctx.fillStyle = '#fff'
  ctx.font = 'bold 10px monospace'
  ctx.fillText(`SCORE: ${myScore}`, 310, 17)

  // All players scores
  ctx.textAlign = 'left'
  ctx.font = '7px monospace'
  let sy = 30
  for (const [pid, p] of Object.entries(players)) {
    const isMe = pid === myId
    ctx.fillStyle = isMe ? '#FFD740' : '#aaa'
    ctx.fillText(`${p.name}: ${p.score} (x${p.combo})`, 10, sy)
    sy += 10
  }

  ctx.restore()

  // Check end
  if (currentBeat >= TOTAL_BEATS + 2 && gamePhase === 'playing') {
    endGame()
  }
}

function drawResult() {
  ctx.clearRect(0, 0, W, H)
  ctx.save()
  const ox = (W - 320 * SCALE) / 2
  const oy = (H - 180 * SCALE) / 2
  ctx.translate(ox, oy)
  ctx.scale(SCALE, SCALE)

  const isWin = totalScore >= ESCAPE_THRESHOLD * 80
  ctx.drawImage(isWin ? IMG.win : IMG.lose, 0, 0, 320, 180)

  ctx.fillStyle = '#fff'
  ctx.font = 'bold 12px sans-serif'
  ctx.textAlign = 'center'
  ctx.fillText(`TOTAL SCORE: ${totalScore}`, 160, 160)
  ctx.font = '9px sans-serif'
  ctx.fillText(`MAX COMBO: ${myMaxCombo}`, 160, 172)

  ctx.restore()
}

function endGame() {
  gamePhase = 'result'
  totalScore = 0
  for (const p of Object.values(players)) totalScore += p.score
  if (bgm) { bgm.pause(); bgm = null }
  broadcastScore()
}

// ===== Game Loop =====
function loop() {
  requestAnimationFrame(loop)
  if (gamePhase === 'playing') drawGame()
  else if (gamePhase === 'result') drawResult()
}

// ===== Start =====
function startGame() {
  generateNotes()
  myScore = 0; myCombo = 0; myMaxCombo = 0
  hitFeedback = ''; doorOpen = false
  gamePhase = 'playing'

  bgm = new Audio('assets/bgm.mp3')
  bgm.play().then(() => {
    musicStart = performance.now()
  }).catch(() => {
    // Autoplay blocked - start on next tap
    musicStart = performance.now()
  })
}

// ===== Join Flow =====
const roomInfo = document.getElementById('room-info')
const nameInput = document.getElementById('name-input')
const joinBtn = document.getElementById('join-btn')

if (!roomId) {
  roomInfo.textContent = 'URL に ?room=XXXX が必要です'
} else {
  roomInfo.textContent = `Room: ${roomId}`
}

nameInput.addEventListener('input', () => { joinBtn.disabled = !nameInput.value.trim() })
nameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter' && nameInput.value.trim()) joinBtn.click() })

joinBtn.addEventListener('click', () => {
  myId = nameInput.value.trim()
  if (!myId || !roomId) return
  document.getElementById('join-screen').style.display = 'none'

  players[myId] = { name: myId, score: 0, combo: 0, maxCombo: 0 }

  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
  channel = sb.channel(`room-${roomId}`, { config: { broadcast: { self: true } } })

  channel.on('broadcast', { event: 'jailbreak_score' }, (msg) => {
    const d = msg?.payload ?? msg
    if (d.playerId && d.playerId !== myId) {
      if (!players[d.playerId]) players[d.playerId] = { name: d.playerId, score: 0, combo: 0, maxCombo: 0 }
      players[d.playerId].score = d.score
      players[d.playerId].combo = d.combo
      players[d.playerId].maxCombo = d.maxCombo
    }
  })

  channel.on('broadcast', { event: 'jailbreak_start' }, () => {
    if (gamePhase === 'waiting') startGame()
  })

  channel.subscribe((status) => {
    if (status === 'SUBSCRIBED') {
      channel.send({ type: 'broadcast', event: 'jailbreak_join', payload: { playerId: myId } })
      // If first player, wait. Host sends jailbreak_start
      // For now, auto-start after 3 seconds
      setTimeout(() => {
        if (gamePhase === 'waiting') {
          channel.send({ type: 'broadcast', event: 'jailbreak_start', payload: {} })
          startGame()
        }
      }, 3000)
    }
  })
})

// ===== Init =====
loadImages(() => {
  loop()
})
</script>
</body>
</html>
