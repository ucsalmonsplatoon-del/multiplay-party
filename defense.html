<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>魔石防衛隊</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #eee;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow-x: hidden;
    }

    .screen { display: none; width: 100%; max-width: 380px; text-align: center; }
    .screen.active { display: flex; flex-direction: column; align-items: center; gap: 12px; }

    h1 { font-size: 1.6em; margin-bottom: 4px; }
    h2 { font-size: 1.2em; color: #aaa; }

    .emoji-large { font-size: 3.5em; }

    input[type="text"] {
      width: 100%; max-width: 280px;
      padding: 12px 16px; font-size: 1em;
      border: 2px solid #444; border-radius: 12px;
      background: #16213e; color: #eee;
      outline: none; text-align: center;
    }
    input[type="text"]:focus { border-color: #9c27b0; }

    .btn {
      padding: 12px 28px; font-size: 1em; font-weight: bold;
      border: none; border-radius: 12px; cursor: pointer;
      transition: transform 0.1s, opacity 0.2s; color: #fff;
    }
    .btn:active { transform: scale(0.95); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-primary { background: #9c27b0; }

    .room-code {
      background: #9c27b0; padding: 6px 16px; border-radius: 8px;
      font-size: 1.3em; font-weight: bold; letter-spacing: 3px;
    }

    .player-list { width: 100%; list-style: none; text-align: left; }
    .player-list li {
      padding: 8px 12px; background: #16213e; border-radius: 8px; margin-bottom: 4px;
    }

    /* Status bar */
    .status-bar {
      display: flex; gap: 8px; justify-content: center;
      flex-wrap: wrap; width: 100%;
    }
    .stat-chip {
      background: #16213e; padding: 4px 10px; border-radius: 8px;
      font-size: 0.85em; color: #ccc;
    }
    .stat-chip.hp { color: #ef5350; }
    .stat-chip.stone { color: #ffd54f; }

    /* 3D canvas */
    #defense-canvas {
      width: 100%; max-width: 380px;
      height: 260px;
      border-radius: 12px;
      background: #111;
      touch-action: none;
    }

    /* Action buttons */
    .action-grid {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 6px; width: 100%;
    }
    .action-btn {
      padding: 10px 4px; font-size: 0.85em; font-weight: bold;
      border: 2px solid #444; border-radius: 10px;
      background: #16213e; color: #eee; cursor: pointer;
      transition: all 0.15s;
    }
    .action-btn:active { transform: scale(0.95); }
    .action-btn.selected { border-color: #ffd740; background: #2a2a4e; }
    .action-btn:disabled { opacity: 0.35; cursor: not-allowed; }

    .skill-row {
      display: flex; gap: 6px; justify-content: center; width: 100%;
    }
    .skill-btn {
      flex: 1; padding: 8px 4px; font-size: 0.8em; font-weight: bold;
      border: 2px solid #7B1FA2; border-radius: 10px;
      background: rgba(123,31,162,0.2); color: #CE93D8; cursor: pointer;
    }
    .skill-btn:active { transform: scale(0.95); }
    .skill-btn.used { opacity: 0.3; pointer-events: none; }
    .skill-btn.selected { border-color: #ffd740; background: rgba(123,31,162,0.4); }

    .waiting-msg {
      color: #888; font-size: 0.95em; padding: 8px;
    }

    .log-box {
      width: 100%; max-height: 60px; overflow-y: auto;
      background: #111; border-radius: 8px; padding: 6px 10px;
      font-size: 0.75em; color: #888; text-align: left;
    }
    .log-box p { margin: 2px 0; }
    .log-box p:first-child { color: #ccc; }

    /* Result */
    .result-stat {
      display: flex; justify-content: space-between;
      padding: 6px 0; border-bottom: 1px solid #2a2a4e;
    }
    .result-stat:last-child { border-bottom: none; }
  </style>
</head>
<body>

  <!-- Join Screen -->
  <div id="join-screen" class="screen active">
    <div class="emoji-large">🔮</div>
    <h1>魔石防衛隊</h1>
    <div class="room-code" id="room-code-display">---</div>
    <input type="text" id="nickname" placeholder="ニックネームを入力" maxlength="10" autocomplete="off">
    <button class="btn btn-primary" id="join-btn" disabled>参加する</button>
  </div>

  <!-- Waiting Screen -->
  <div id="waiting-screen" class="screen">
    <div class="emoji-large">⏳</div>
    <h2>ホストの開始を待っています...</h2>
    <div style="color:#888; font-size:0.9em;" id="waiting-status">接続中...</div>
    <h3 style="align-self: flex-start;">参加者</h3>
    <ul class="player-list" id="player-list"></ul>
  </div>

  <!-- Game Screen -->
  <div id="game-screen" class="screen">
    <!-- Status Bar -->
    <div class="status-bar" id="status-bar"></div>

    <!-- 3D Canvas -->
    <canvas id="defense-canvas"></canvas>

    <!-- Actions -->
    <div id="action-panel"></div>

    <!-- Log -->
    <div class="log-box" id="log-box"></div>
  </div>

  <!-- Result Screen -->
  <div id="result-screen" class="screen">
    <div class="emoji-large" id="result-emoji">🎉</div>
    <h1 id="result-title">勝利！</h1>
    <p style="color:#aaa;" id="result-subtitle"></p>
    <div style="width:100%; background:#16213e; border-radius:12px; padding:16px;" id="result-stats"></div>
  </div>

  <!-- Closed Screen -->
  <div id="closed-screen" class="screen">
    <div class="emoji-large">👋</div>
    <h1>部屋が閉じられました</h1>
    <p style="color:#888;">ありがとうございました！</p>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

(function() {
  const SUPABASE_URL = 'https://eixvkfbdplxgpypxjtml.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVpeHZrZmJkcGx4Z3B5cHhqdG1sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQzMjI5NjksImV4cCI6MjA3OTg5ODk2OX0.vmSeqMS6DQW_gFk9rIhq2lj_x9RTgncBFfhSb9_i0y8';

  const params = new URLSearchParams(window.location.search);
  const roomId = params.get('room');
  const playerId = crypto.randomUUID();
  let channel = null;
  let myName = '';

  // Game state
  let gameState = null;
  let selectedAction = null;
  let selectedSkill = null;
  let actionSent = false;

  // Three.js state
  let threeRenderer = null;
  let threeScene = null;
  let threeCamera = null;
  let threeControls = null;
  let tileMeshes = {};
  let unitMeshes = {};
  let raycaster = null;
  let pointer = new THREE.Vector2();
  let threeInited = false;

  const SQRT3 = Math.sqrt(3);
  const TILE_COLORS = {
    grass:    0x4CAF50,
    water:    0x2196F3,
    mountain: 0x9E9E9E,
    forest:   0x2E7D32,
    sand:     0xFFEB3B,
    village:  0xFF9800,
  };
  const TILE_HEIGHTS = {
    grass: 0.0, water: -0.1, mountain: 0.5,
    forest: 0.15, sand: 0.0, village: 0.1,
  };

  const $ = id => document.getElementById(id);

  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    $(id).classList.add('active');
  }

  function hexToWorld(q, r) {
    return { x: SQRT3 * q + SQRT3 / 2 * r, z: 1.5 * r };
  }

  // ===== Three.js =====

  function initThree() {
    if (threeInited) return;
    threeInited = true;

    const canvas = $('defense-canvas');
    threeRenderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    threeRenderer.setPixelRatio(window.devicePixelRatio);
    threeRenderer.setClearColor(0x111111);

    const w = canvas.clientWidth;
    const h = canvas.clientHeight;
    threeRenderer.setSize(w, h, false);

    threeScene = new THREE.Scene();
    threeCamera = new THREE.PerspectiveCamera(50, w / h, 0.1, 100);
    threeCamera.position.set(0, 8, 6);
    threeCamera.lookAt(0, 0, 0);

    threeControls = new OrbitControls(threeCamera, canvas);
    threeControls.enableDamping = true;
    threeControls.dampingFactor = 0.1;
    threeControls.maxPolarAngle = Math.PI / 2.2;
    threeControls.minDistance = 3;
    threeControls.maxDistance = 20;

    threeScene.add(new THREE.AmbientLight(0xffffff, 0.5));
    const dl = new THREE.DirectionalLight(0xffffff, 0.7);
    dl.position.set(-3, 8, 4);
    threeScene.add(dl);

    raycaster = new THREE.Raycaster();

    // Click handler
    canvas.addEventListener('click', onCanvasClick);

    animate();
  }

  function animate() {
    requestAnimationFrame(animate);
    if (threeControls) threeControls.update();
    if (threeRenderer && threeScene && threeCamera) {
      threeRenderer.render(threeScene, threeCamera);
    }
  }

  function onCanvasClick(event) {
    if (actionSent) return;
    if (!selectedAction && !selectedSkill) return;

    const canvas = $('defense-canvas');
    const rect = canvas.getBoundingClientRect();
    pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
    pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

    raycaster.setFromCamera(pointer, threeCamera);
    const meshes = Object.values(tileMeshes);
    const hits = raycaster.intersectObjects(meshes);
    if (hits.length > 0) {
      const { q, r } = hits[0].object.userData;
      if (q !== undefined) {
        onHexClick(q, r);
      }
    }
  }

  function render3DView() {
    if (!gameState || !threeScene) return;

    const tiles = gameState.tiles || [];
    const units = gameState.units || [];
    const centerQ = gameState.centerQ || 0;
    const centerR = gameState.centerR || 0;

    // Clear old tiles
    Object.values(tileMeshes).forEach(m => threeScene.remove(m));
    tileMeshes = {};

    // Clear old units
    Object.values(unitMeshes).forEach(m => threeScene.remove(m));
    unitMeshes = {};

    const hexGeo = new THREE.CylinderGeometry(0.9, 0.9, 0.3, 6);

    tiles.forEach(tile => {
      const dq = tile.q - centerQ;
      const dr = tile.r - centerR;
      const color = TILE_COLORS[tile.type] || 0x888888;
      const height = TILE_HEIGHTS[tile.type] || 0;
      const mat = new THREE.MeshLambertMaterial({ color });
      const mesh = new THREE.Mesh(hexGeo, mat);

      const pos = hexToWorld(dq, dr);
      if (tile.type === 'mountain') {
        mesh.scale.set(1, 3, 1);
        mesh.position.set(pos.x, height + 0.45, pos.z);
      } else {
        mesh.position.set(pos.x, height, pos.z);
      }

      mesh.userData = { q: tile.q, r: tile.r, type: tile.type };
      threeScene.add(mesh);
      tileMeshes[`${tile.q},${tile.r}`] = mesh;

      // Stone markers
      if (tile.stones > 0) {
        for (let i = 0; i < tile.stones && i < 3; i++) {
          const sg = new THREE.OctahedronGeometry(0.12);
          const sm = new THREE.MeshLambertMaterial({ color: 0xffbf00 });
          const smesh = new THREE.Mesh(sg, sm);
          const angle = (i / Math.max(tile.stones, 1)) * Math.PI * 2;
          smesh.position.set(
            pos.x + Math.cos(angle) * 0.3,
            0.3,
            pos.z + Math.sin(angle) * 0.3
          );
          threeScene.add(smesh);
          // Store for cleanup as pseudo-tile
          tileMeshes[`stone_${tile.q}_${tile.r}_${i}`] = smesh;
        }
      }
    });

    // Magic circle marker (if center tile is visible)
    const mcTile = tiles.find(t => t.q === 0 && t.r === 0);
    if (mcTile) {
      const mcDq = 0 - centerQ;
      const mcDr = 0 - centerR;
      const mcPos = hexToWorld(mcDq, mcDr);
      const ringGeo = new THREE.RingGeometry(0.4, 0.6, 6);
      const ringMat = new THREE.MeshBasicMaterial({
        color: 0xce93d8, side: THREE.DoubleSide,
        transparent: true, opacity: 0.6,
      });
      const ring = new THREE.Mesh(ringGeo, ringMat);
      ring.rotation.x = -Math.PI / 2;
      ring.position.set(mcPos.x, 0.16, mcPos.z);
      threeScene.add(ring);
      tileMeshes['magic_ring'] = ring;
    }

    // Units
    units.forEach(u => {
      if (u.hp <= 0 && u.type !== 'player') return;

      const dq = u.q - centerQ;
      const dr = u.r - centerR;
      const pos = hexToWorld(dq, dr);
      const tileH = TILE_HEIGHTS[tiles.find(t => t.q === u.q && t.r === u.r)?.type] || 0;
      const baseY = Math.max(tileH, 0) + 0.15;

      let radius, color;
      if (u.type === 'player') {
        radius = 0.25;
        color = u.id === playerId ? 0x64B5F6 : 0x42A5F5;
      } else if (u.type === 'skeleton') {
        radius = 0.2; color = 0xEF5350;
      } else {
        radius = 0.35; color = 0x795548;
      }

      const geo = new THREE.SphereGeometry(radius, 12, 12);
      const mat = new THREE.MeshLambertMaterial({
        color,
        opacity: u.hp > 0 ? 1.0 : 0.4,
        transparent: u.hp <= 0,
      });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(pos.x, baseY + radius, pos.z);
      threeScene.add(mesh);
      unitMeshes[u.id] = mesh;

      // HP bar
      if (u.hp > 0) {
        const ratio = u.hp / u.maxHp;
        const barW = 0.5;
        const barH = 0.06;
        const bgGeo = new THREE.PlaneGeometry(barW, barH);
        const bgMat = new THREE.MeshBasicMaterial({ color: 0x333333, side: THREE.DoubleSide });
        const bg = new THREE.Mesh(bgGeo, bgMat);
        bg.position.set(pos.x, baseY + radius * 2 + 0.12, pos.z);
        bg.lookAt(threeCamera.position);
        threeScene.add(bg);
        unitMeshes[u.id + '_hpbg'] = bg;

        const fillGeo = new THREE.PlaneGeometry(barW * ratio, barH);
        const fillColor = ratio > 0.5 ? 0x4caf50 : ratio > 0.25 ? 0xff9800 : 0xf44336;
        const fillMat = new THREE.MeshBasicMaterial({ color: fillColor, side: THREE.DoubleSide });
        const fill = new THREE.Mesh(fillGeo, fillMat);
        fill.position.set(pos.x - (barW * (1 - ratio)) / 2, baseY + radius * 2 + 0.12, pos.z);
        fill.lookAt(threeCamera.position);
        threeScene.add(fill);
        unitMeshes[u.id + '_hp'] = fill;
      }

      // Stone indicator
      if (u.carryingStone) {
        const sg = new THREE.OctahedronGeometry(0.1);
        const sm = new THREE.MeshLambertMaterial({ color: 0xffbf00 });
        const smesh = new THREE.Mesh(sg, sm);
        smesh.position.set(pos.x + 0.25, baseY + radius * 2 + 0.2, pos.z);
        threeScene.add(smesh);
        unitMeshes[u.id + '_stone'] = smesh;
      }
    });

    // Center camera on player view
    threeCamera.position.set(0, 6, 5);
    threeCamera.lookAt(0, 0, 0);
    if (threeControls) threeControls.target.set(0, 0, 0);
  }

  // Init
  if (!roomId) {
    $('room-code-display').textContent = 'エラー';
    $('join-btn').disabled = true;
    return;
  }
  $('room-code-display').textContent = roomId;

  const nicknameInput = $('nickname');
  const joinBtn = $('join-btn');
  nicknameInput.addEventListener('input', () => {
    joinBtn.disabled = !nicknameInput.value.trim();
  });

  // Join
  joinBtn.addEventListener('click', async () => {
    myName = nicknameInput.value.trim();
    if (!myName) return;
    joinBtn.disabled = true;
    joinBtn.textContent = '接続中...';

    try {
      const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      channel = sb.channel(`room-${roomId}`, { config: { broadcast: { self: true } } });

      const unwrap = (msg) => msg?.payload ?? msg;

      channel.on('broadcast', { event: 'players' }, (msg) => onPlayers(unwrap(msg)));
      channel.on('broadcast', { event: 'room_closed' }, () => onRoomClosed());
      channel.on('broadcast', { event: 'defense_state' }, (msg) => onDefenseState(unwrap(msg)));
      channel.on('broadcast', { event: 'defense_player_view' }, (msg) => onPlayerView(unwrap(msg)));
      channel.on('broadcast', { event: 'defense_resolve_log' }, (msg) => onResolveLog(unwrap(msg)));
      channel.on('broadcast', { event: 'defense_wave_start' }, (msg) => onWaveStart(unwrap(msg)));
      channel.on('broadcast', { event: 'defense_game_over' }, (msg) => onGameOver(unwrap(msg)));
      channel.on('broadcast', { event: 'defense_action_received' }, (msg) => onActionReceived(unwrap(msg)));

      await channel.subscribe();

      await channel.send({
        type: 'broadcast', event: 'join',
        payload: { playerId, name: myName }
      });

      showScreen('waiting-screen');
      $('waiting-status').textContent = '接続完了！';
    } catch (e) {
      joinBtn.disabled = false;
      joinBtn.textContent = '参加する';
      alert('接続エラー: ' + e.message);
    }
  });

  // ===== Event Handlers =====

  function onPlayers(payload) {
    const players = payload.players || [];
    const list = $('player-list');
    list.innerHTML = '';
    players.forEach((p, i) => {
      const li = document.createElement('li');
      li.textContent = `${i + 1}. ${p.name}`;
      list.appendChild(li);
    });
  }

  function onRoomClosed() {
    showScreen('closed-screen');
    if (channel) { channel.unsubscribe(); channel = null; }
  }

  function onDefenseState(payload) {
    if (!gameState) {
      gameState = payload;
    }
  }

  function onPlayerView(payload) {
    if (payload.playerId !== playerId) return;
    gameState = payload;
    showScreen('game-screen');

    if (payload.phase === 'actionInput') {
      actionSent = false;
    }

    initThree();
    renderStatusBar();
    render3DView();
    renderActions();
    renderLog();
  }

  function onResolveLog(payload) {
    const events = payload.events || [];
    const logBox = $('log-box');
    events.forEach(ev => {
      const p = document.createElement('p');
      p.textContent = ev.description || '';
      logBox.prepend(p);
    });
  }

  function onWaveStart(payload) {
    if (gameState) {
      gameState.wave = payload.wave;
      gameState.quota = payload.quota;
      gameState.maxTurns = payload.maxTurns;
      if (payload.skills && payload.skills[playerId]) {
        gameState.skills = payload.skills[playerId];
      }
    }
    actionSent = false;
    $('log-box').innerHTML = `<p>Wave ${payload.wave} 開始！目標: ${payload.quota}個</p>`;
  }

  function onActionReceived(payload) {}

  function onGameOver(payload) {
    showScreen('result-screen');
    const victory = payload.victory;
    $('result-emoji').textContent = victory ? '🎉' : '💀';
    $('result-title').textContent = victory ? '勝利！' : '敗北...';
    $('result-subtitle').textContent = victory ? '全Waveを突破した！' : '魔石を守りきれなかった...';
    $('result-stats').innerHTML = `
      <div class="result-stat"><span>Wave到達</span><span>${payload.waves}/2</span></div>
      <div class="result-stat"><span>魔石納品</span><span>${payload.delivered}個</span></div>
      <div class="result-stat"><span>使用ターン</span><span>${payload.turnsUsed}</span></div>
    `;
  }

  // ===== Rendering =====

  function renderStatusBar() {
    if (!gameState) return;
    const s = gameState;
    const myUnit = s.myUnit;
    const hearts = myUnit
      ? Array.from({length: myUnit.maxHp}, (_, i) => i < myUnit.hp ? '\u2665' : '\u2661').join('')
      : '---';

    $('status-bar').innerHTML = `
      <span class="stat-chip">W${s.wave || 1}/2</span>
      <span class="stat-chip">T${s.turn || 1}/${s.maxTurns || 8}</span>
      <span class="stat-chip hp">${hearts}</span>
      <span class="stat-chip stone">\u25C6${s.delivered || 0}/${s.quota || 3}</span>
      <span class="stat-chip">${myUnit && myUnit.carryingStone ? '石:有' : '石:無'}</span>
    `;
  }

  function renderActions() {
    if (!gameState) return;
    const panel = $('action-panel');
    const phase = gameState.phase;

    if (phase !== 'actionInput' || actionSent) {
      panel.innerHTML = `<p class="waiting-msg">${actionSent ? 'アクション送信済み 待機中...' : phase === 'resolving' ? '解決中...' : phase === 'enemyTurn' ? '敵ターン...' : '待機中...'}</p>`;
      return;
    }

    const myUnit = gameState.myUnit;
    if (!myUnit || myUnit.hp <= 0) {
      panel.innerHTML = '<p class="waiting-msg">ダウン中... 仲間の救出を待っています</p>';
      return;
    }

    const actions = [
      { id: 'move', label: '🚶移動', needsTarget: true },
      { id: 'attack', label: '⚔攻撃', needsTarget: true },
      { id: 'pickup', label: '⬇拾う', needsTarget: false },
      { id: 'deliver', label: '⬆納品', needsTarget: false },
      { id: 'rescue', label: '💚救出', needsTarget: true },
      { id: 'wait', label: '⏳待機', needsTarget: false },
    ];

    let html = '<div class="action-grid">';
    actions.forEach(a => {
      const sel = selectedAction === a.id ? ' selected' : '';
      html += `<button class="action-btn${sel}" data-action="${a.id}" data-needs-target="${a.needsTarget}">${a.label}</button>`;
    });
    html += '</div>';

    // Skills
    const skills = gameState.skills || [];
    if (skills.length > 0) {
      html += '<div class="skill-row" style="margin-top:6px;">';
      skills.forEach(s => {
        const cls = s.used ? ' used' : (selectedSkill === s.type ? ' selected' : '');
        html += `<button class="skill-btn${cls}" data-skill="${s.type}">${skillEmoji(s.type)}${skillName(s.type)}</button>`;
      });
      html += '</div>';
    }

    panel.innerHTML = html;

    // Bind action buttons
    panel.querySelectorAll('.action-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const action = btn.dataset.action;
        const needsTarget = btn.dataset.needsTarget === 'true';
        selectedSkill = null;

        if (!needsTarget) {
          sendAction(action);
        } else {
          selectedAction = selectedAction === action ? null : action;
          renderActions();
        }
      });
    });

    // Bind skill buttons
    panel.querySelectorAll('.skill-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const skill = btn.dataset.skill;
        selectedAction = null;
        selectedSkill = selectedSkill === skill ? null : skill;
        renderActions();
      });
    });
  }

  function skillEmoji(type) {
    const map = { charge: '⚔', longPass: '🎯', heal: '💚', taunt: '😤' };
    return map[type] || '✨';
  }

  function skillName(type) {
    const map = { charge: '突撃', longPass: '遠投', heal: '回復', taunt: '挑発' };
    return map[type] || type;
  }

  function hexDist(q1, r1, q2, r2) {
    return (Math.abs(q1 - q2) + Math.abs(r1 - r2) + Math.abs((-q1 - r1) - (-q2 - r2))) / 2;
  }

  function onHexClick(q, r) {
    if (actionSent) return;

    if (selectedAction) {
      sendAction(selectedAction, q, r);
    } else if (selectedSkill) {
      sendAction('skill', q, r, selectedSkill);
    }
  }

  function sendAction(action, targetQ, targetR, skill) {
    if (!channel || actionSent) return;

    const payload = {
      playerId,
      gameId: 'defense',
      data: { action }
    };
    if (targetQ != null) {
      payload.data.targetQ = targetQ;
      payload.data.targetR = targetR;
    }
    if (skill) {
      payload.data.skill = skill;
    }

    channel.send({
      type: 'broadcast',
      event: 'game_input',
      payload
    });

    actionSent = true;
    selectedAction = null;
    selectedSkill = null;
    renderActions();
  }

  function renderLog() {
    if (!gameState) return;
    const logBox = $('log-box');
    const logs = gameState.log || [];
    logBox.innerHTML = '';
    logs.forEach(msg => {
      const p = document.createElement('p');
      p.textContent = msg;
      logBox.appendChild(p);
    });
  }

})();
</script>
</body>
</html>
