<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>パーティゲーム</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #eee;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .screen { display: none; width: 100%; max-width: 400px; text-align: center; }
    .screen.active { display: flex; flex-direction: column; align-items: center; gap: 16px; }

    h1 { font-size: 1.8em; margin-bottom: 8px; }
    h2 { font-size: 1.4em; color: #aaa; }

    .emoji-large { font-size: 4em; }

    input[type="text"] {
      width: 100%;
      max-width: 300px;
      padding: 14px 18px;
      font-size: 1.1em;
      border: 2px solid #444;
      border-radius: 12px;
      background: #16213e;
      color: #eee;
      outline: none;
      text-align: center;
    }
    input[type="text"]:focus { border-color: #6c63ff; }

    .btn {
      padding: 14px 32px;
      font-size: 1.1em;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
      color: #fff;
    }
    .btn:active { transform: scale(0.95); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-primary { background: #6c63ff; }
    .btn-primary:hover:not(:disabled) { background: #5a52d5; }

    .hand-buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .hand-btn {
      width: 100px;
      height: 100px;
      font-size: 3em;
      border: 3px solid #444;
      border-radius: 20px;
      background: #16213e;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .hand-btn:hover { border-color: #6c63ff; background: #1a1a4e; }
    .hand-btn:active { transform: scale(0.9); }
    .hand-btn.selected { border-color: #6c63ff; background: #2a2a6e; box-shadow: 0 0 20px rgba(108,99,255,0.4); }
    .hand-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .player-list {
      width: 100%;
      list-style: none;
      text-align: left;
    }
    .player-list li {
      padding: 10px 16px;
      background: #16213e;
      border-radius: 8px;
      margin-bottom: 6px;
      font-size: 1em;
    }

    .countdown {
      font-size: 6em;
      font-weight: bold;
      color: #6c63ff;
      animation: pulse 0.5s ease-in-out;
    }
    @keyframes pulse {
      0% { transform: scale(0.5); opacity: 0; }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); opacity: 1; }
    }

    .result-card {
      background: #16213e;
      border-radius: 16px;
      padding: 20px;
      width: 100%;
    }

    .result-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid #2a2a4e;
    }
    .result-item:last-child { border-bottom: none; }

    .winner { color: #ffd700; font-weight: bold; }
    .status { color: #888; font-size: 0.9em; }

    .room-code {
      background: #6c63ff;
      padding: 8px 20px;
      border-radius: 8px;
      font-size: 1.4em;
      font-weight: bold;
      letter-spacing: 3px;
    }

    .ranking-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: #16213e;
      border-radius: 12px;
      margin-bottom: 8px;
      width: 100%;
    }
    .ranking-item.first { background: rgba(255,215,0,0.15); border: 2px solid #ffd700; }
    .rank-num { font-size: 1.8em; min-width: 40px; }
    .rank-name { flex: 1; font-size: 1.1em; }
    .rank-wins { font-weight: bold; font-size: 1.1em; }

    /* World mode styles */
    #world-screen { position: relative; max-width: 100%; width: 100vw; height: 100dvh; padding: 0; }
    #world-screen.active { padding: 0; justify-content: flex-start; }
    #world-canvas { width: 100%; height: 100%; display: block; }
    #world-ui {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      z-index: 10;
    }
    #world-status {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.7);
      padding: 8px 20px;
      border-radius: 12px;
      font-size: 1em;
      z-index: 10;
      white-space: nowrap;
    }
    .move-btn {
      width: 56px;
      height: 48px;
      font-size: 1.4em;
      border: 2px solid #6c63ff;
      border-radius: 12px;
      background: rgba(108,99,255,0.3);
      color: #fff;
      cursor: pointer;
    }
    .move-btn:active { transform: scale(0.9); background: rgba(108,99,255,0.6); }

    /* Minigame overlay */
    #minigame-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.9);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 100;
    }
    #minigame-overlay.active { display: flex; }
  </style>
</head>
<body>

  <!-- 参加画面 -->
  <div id="join-screen" class="screen active">
    <div class="emoji-large">🎮</div>
    <h1>パーティゲーム</h1>
    <div class="room-code" id="room-code-display">---</div>
    <input type="text" id="nickname" placeholder="ニックネームを入力" maxlength="10" autocomplete="off">
    <button class="btn btn-primary" id="join-btn" disabled>参加する</button>
  </div>

  <!-- 待機画面 -->
  <div id="waiting-screen" class="screen">
    <h2>ホストの開始を待っています...</h2>
    <div class="status" id="waiting-status">接続中...</div>
    <h3 style="align-self: flex-start;">参加者</h3>
    <ul class="player-list" id="player-list"></ul>
  </div>

  <!-- ゲーム画面 (じゃんけん) -->
  <div id="game-screen" class="screen">
    <h2 id="round-label">Round 1 / 3</h2>
    <div id="game-status"></div>
    <div id="countdown-display" class="countdown" style="display:none;"></div>
    <div class="hand-buttons" id="hand-buttons" style="display:none;">
      <button class="hand-btn" data-hand="rock">✊</button>
      <button class="hand-btn" data-hand="scissors">✌️</button>
      <button class="hand-btn" data-hand="paper">✋</button>
    </div>
    <div id="hand-status" style="display:none;" class="status">他の人を待っています...</div>

    <!-- ラウンド結果 -->
    <div id="round-result" style="display:none;">
      <h2 id="result-title"></h2>
      <div class="result-card" id="result-hands"></div>
    </div>
  </div>

  <!-- 最終結果画面 -->
  <div id="result-screen" class="screen">
    <div class="emoji-large">🏆</div>
    <h1>最終結果</h1>
    <div id="ranking-list" style="width:100%;"></div>
  </div>

  <!-- 部屋閉鎖 -->
  <div id="closed-screen" class="screen">
    <div class="emoji-large">👋</div>
    <h1>部屋が閉じられました</h1>
    <p class="status">ありがとうございました！</p>
  </div>

  <!-- ワールド画面 (Three.js 3D) -->
  <div id="world-screen" class="screen">
    <canvas id="world-canvas"></canvas>
    <div id="world-status">マップ読込中...</div>
    <div id="world-ui"></div>
  </div>

  <!-- ミニゲームオーバーレイ -->
  <div id="minigame-overlay">
    <div class="emoji-large" id="minigame-emoji">✊</div>
    <h1 id="minigame-title">ミニゲーム</h1>
    <div id="minigame-content"></div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

(function() {
  // ===== 設定 =====
  const SUPABASE_URL = 'https://eixvkfbdplxgpypxjtml.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVpeHZrZmJkcGx4Z3B5cHhqdG1sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQzMjI5NjksImV4cCI6MjA3OTg5ODk2OX0.vmSeqMS6DQW_gFk9rIhq2lj_x9RTgncBFfhSb9_i0y8';

  // ===== 状態 =====
  const params = new URLSearchParams(window.location.search);
  const roomId = params.get('room');
  const playerId = crypto.randomUUID();
  let channel = null;
  let myName = '';
  let handSent = false;

  // World state
  let worldData = null;
  let validMoves = [];
  let isMyTurn = false;
  let threeScene = null;
  let threeRenderer = null;
  let threeCamera = null;
  let threeControls = null;
  let playerMeshes = {};
  let tileMeshes = {};

  // ===== DOM =====
  const $ = id => document.getElementById(id);

  // 画面切り替え
  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    $(id).classList.add('active');
    if (id === 'world-screen' && threeRenderer) {
      onWindowResize();
    }
  }

  // ===== 初期化 =====
  if (!roomId) {
    $('room-code-display').textContent = 'エラー';
    $('join-btn').disabled = true;
    return;
  }

  $('room-code-display').textContent = roomId;

  const nicknameInput = $('nickname');
  const joinBtn = $('join-btn');

  nicknameInput.addEventListener('input', () => {
    joinBtn.disabled = !nicknameInput.value.trim();
  });

  // ===== 参加処理 =====
  joinBtn.addEventListener('click', async () => {
    myName = nicknameInput.value.trim();
    if (!myName) return;

    joinBtn.disabled = true;
    joinBtn.textContent = '接続中...';

    try {
      const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      channel = supabase.channel(`room-${roomId}`, { config: { broadcast: { self: true } } });

      const unwrap = (msg) => msg?.payload ?? msg;

      // Existing events
      channel.on('broadcast', { event: 'players' }, (msg) => { onPlayers(unwrap(msg)); });
      channel.on('broadcast', { event: 'round_start' }, (msg) => { onRoundStart(unwrap(msg)); });
      channel.on('broadcast', { event: 'countdown' }, (msg) => { onCountdown(unwrap(msg)); });
      channel.on('broadcast', { event: 'round_result' }, (msg) => { onRoundResult(unwrap(msg)); });
      channel.on('broadcast', { event: 'game_result' }, (msg) => { onGameResult(unwrap(msg)); });
      channel.on('broadcast', { event: 'room_closed' }, (msg) => { onRoomClosed(); });

      // World mode events
      channel.on('broadcast', { event: 'phase' }, (msg) => { onPhase(unwrap(msg)); });
      channel.on('broadcast', { event: 'world_ready' }, (msg) => { onWorldReady(unwrap(msg)); });
      channel.on('broadcast', { event: 'turn_prompt' }, (msg) => { onTurnPrompt(unwrap(msg)); });
      channel.on('broadcast', { event: 'player_moved' }, (msg) => { onPlayerMoved(unwrap(msg)); });
      channel.on('broadcast', { event: 'minigame_start' }, (msg) => { onMinigameStart(unwrap(msg)); });
      channel.on('broadcast', { event: 'minigame_end' }, (msg) => { onMinigameEnd(unwrap(msg)); });

      await channel.subscribe();

      // 参加イベント送信
      await channel.send({
        type: 'broadcast',
        event: 'join',
        payload: { playerId, name: myName }
      });

      showScreen('waiting-screen');
      $('waiting-status').textContent = '接続完了！';
    } catch (e) {
      joinBtn.disabled = false;
      joinBtn.textContent = '参加する';
      alert('接続エラー: ' + e.message);
    }
  });

  // ===== Janken Event Handlers (existing) =====

  function onPlayers(payload) {
    const players = payload.players || [];
    const list = $('player-list');
    list.innerHTML = '';
    players.forEach((p, i) => {
      const li = document.createElement('li');
      li.textContent = `${i + 1}. ${p.name}${p.score != null ? ` (${p.score}pt)` : ''}`;
      list.appendChild(li);
    });

    // Update player meshes in 3D if world is active
    if (worldData && threeScene) {
      updatePlayerMeshes(players);
    }
  }

  function onRoundStart(payload) {
    handSent = false;
    showScreen('game-screen');
    $('round-label').textContent = `Round ${payload.round} / ${payload.total}`;
    $('game-status').textContent = 'カウントダウン中...';
    $('countdown-display').style.display = 'block';
    $('hand-buttons').style.display = 'none';
    $('hand-status').style.display = 'none';
    $('round-result').style.display = 'none';

    document.querySelectorAll('.hand-btn').forEach(b => {
      b.classList.remove('selected');
      b.disabled = false;
    });
  }

  function onCountdown(payload) {
    const count = payload.count;
    const display = $('countdown-display');

    if (count === 0) {
      display.textContent = '出して！';
      display.style.display = 'block';
      $('game-status').textContent = '';
      setTimeout(() => {
        display.style.display = 'none';
        $('hand-buttons').style.display = 'flex';
      }, 800);
    } else {
      display.textContent = count;
      display.style.display = 'block';
      display.style.animation = 'none';
      display.offsetHeight;
      display.style.animation = '';
    }
  }

  function onRoundResult(payload) {
    const handEmoji = { rock: '✊', scissors: '✌️', paper: '✋' };
    const hands = payload.hands || {};
    const winners = payload.winners || [];
    const isDraw = payload.isDraw;

    showScreen('game-screen');
    $('hand-buttons').style.display = 'none';
    $('hand-status').style.display = 'none';
    $('countdown-display').style.display = 'none';
    $('game-status').textContent = '';

    const resultDiv = $('round-result');
    resultDiv.style.display = 'block';

    $('result-title').textContent = isDraw ? 'あいこ！🔄' : '結果発表！';
    $('result-title').style.color = isDraw ? '#ffd700' : '#6c63ff';

    const handsDiv = $('result-hands');
    handsDiv.innerHTML = '';

    const myHand = hands[playerId];
    const iWon = winners.includes(playerId);

    if (isDraw) {
      handsDiv.innerHTML = `<p style="font-size:1.2em;padding:12px;">あいこです！もう一回！</p>`;
    } else {
      handsDiv.innerHTML = `
        <p style="font-size:2em;padding:12px;">
          ${iWon ? '🎉 勝ち！' : '😢 負け...'}
        </p>
        <p style="color:#888;">あなたの手: ${handEmoji[myHand] || '?'}</p>
      `;
    }
  }

  function onGameResult(payload) {
    const ranking = payload.ranking || [];
    showScreen('result-screen');

    const list = $('ranking-list');
    list.innerHTML = '';
    const medals = ['🥇', '🥈', '🥉'];

    ranking.forEach((p, i) => {
      const div = document.createElement('div');
      div.className = 'ranking-item' + (i === 0 ? ' first' : '');
      div.innerHTML = `
        <span class="rank-num">${medals[i] || (i + 1)}</span>
        <span class="rank-name">${p.name}${p.id === playerId ? ' (あなた)' : ''}</span>
        <span class="rank-wins">${p.wins}勝</span>
      `;
      list.appendChild(div);
    });
  }

  function onRoomClosed() {
    showScreen('closed-screen');
    if (channel) {
      channel.unsubscribe();
      channel = null;
    }
  }

  // ===== 手の選択 (じゃんけん) =====
  document.querySelectorAll('.hand-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      if (handSent) return;
      handSent = true;

      const hand = btn.dataset.hand;
      btn.classList.add('selected');
      document.querySelectorAll('.hand-btn').forEach(b => b.disabled = true);

      channel.send({
        type: 'broadcast',
        event: 'hand',
        payload: { playerId, hand }
      });

      $('hand-buttons').style.display = 'none';
      $('hand-status').style.display = 'block';
      $('hand-status').textContent = '送信済み！他の人を待っています...';
    });
  });

  // ===== World Mode Event Handlers =====

  function onPhase(payload) {
    const phase = payload.phase;
    if (phase === 'generating' || phase === 'exploring' || phase === 'minigame_select') {
      if (!threeScene) {
        initThreeScene();
      }
      showScreen('world-screen');
      $('world-status').textContent =
        phase === 'generating' ? 'マップ生成中...' :
        phase === 'exploring' ? '探索中' :
        'ミニゲーム準備中...';
    }
  }

  function onWorldReady(payload) {
    worldData = payload;
    if (!threeScene) initThreeScene();
    buildHexWorld(payload);
    showScreen('world-screen');
    $('world-status').textContent = 'ワールド準備完了！';
  }

  function onTurnPrompt(payload) {
    const turnPlayerId = payload.playerId;
    validMoves = payload.validMoves || [];

    // Empty playerId = clear signal (turn transitioning)
    if (!turnPlayerId) {
      isMyTurn = false;
      $('world-ui').innerHTML = '';
      $('world-status').textContent = '待機中...';
      return;
    }

    isMyTurn = (turnPlayerId === playerId);

    if (isMyTurn) {
      $('world-status').textContent = 'あなたのターン！移動先を選んでください';
      showMoveButtons(validMoves);
    } else {
      $('world-status').textContent = '他のプレイヤーのターン...';
      $('world-ui').innerHTML = '';
    }
  }

  function onPlayerMoved(payload) {
    const { playerId: movedId, toQ, toR } = payload;
    if (playerMeshes[movedId]) {
      const pos = hexToWorld(toQ, toR);
      playerMeshes[movedId].position.set(pos.x, 0.5, pos.z);
    }
  }

  function onMinigameStart(payload) {
    const gameId = payload.gameId;
    const overlay = $('minigame-overlay');
    overlay.classList.add('active');

    if (gameId === 'janken') {
      $('minigame-emoji').textContent = '✊';
      $('minigame-title').textContent = 'じゃんけん！';
      $('minigame-content').innerHTML = '<p style="color:#aaa;">ホストがラウンドを開始します...</p>';
    } else {
      $('minigame-emoji').textContent = '🎮';
      $('minigame-title').textContent = 'ミニゲーム';
      $('minigame-content').innerHTML = '';
    }
  }

  function onMinigameEnd(payload) {
    const overlay = $('minigame-overlay');
    const scores = payload.scores || {};
    const myScore = scores[playerId] || 0;

    $('minigame-content').innerHTML = `
      <p style="font-size:2em;">${myScore > 0 ? '🎉 +' + myScore + 'pt！' : '😢 0pt'}</p>
    `;

    setTimeout(() => {
      overlay.classList.remove('active');
    }, 2000);
  }

  // ===== Three.js 3D World =====

  const TILE_COLORS = {
    grass:    0x4CAF50,
    water:    0x2196F3,
    mountain: 0x9E9E9E,
    forest:   0x2E7D32,
    sand:     0xFFEB3B,
    village:  0xFF9800,
  };

  const TILE_HEIGHTS = {
    grass: 0.0,
    water: -0.1,
    mountain: 0.5,
    forest: 0.15,
    sand: 0.0,
    village: 0.1,
  };

  const SQRT3 = Math.sqrt(3);

  function hexToWorld(q, r, size = 1.0) {
    const x = size * (SQRT3 * q + SQRT3 / 2 * r);
    const z = size * (1.5 * r);
    return { x, z };
  }

  function initThreeScene() {
    const canvas = $('world-canvas');
    threeRenderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    threeRenderer.setPixelRatio(window.devicePixelRatio);
    threeRenderer.setClearColor(0x1a1a2e);

    threeScene = new THREE.Scene();

    threeCamera = new THREE.PerspectiveCamera(50, canvas.clientWidth / canvas.clientHeight, 0.1, 200);
    threeCamera.position.set(0, 15, 12);
    threeCamera.lookAt(0, 0, 0);

    threeControls = new OrbitControls(threeCamera, canvas);
    threeControls.enableDamping = true;
    threeControls.dampingFactor = 0.1;
    threeControls.maxPolarAngle = Math.PI / 2.2;

    // Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
    threeScene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(-5, 10, 5);
    threeScene.add(dirLight);

    const fillLight = new THREE.DirectionalLight(0xffffff, 0.3);
    fillLight.position.set(5, 5, -5);
    threeScene.add(fillLight);

    onWindowResize();
    window.addEventListener('resize', onWindowResize);

    animateThree();
  }

  function onWindowResize() {
    const canvas = $('world-canvas');
    if (!canvas || !threeRenderer || !threeCamera) return;
    const parent = canvas.parentElement;
    const w = parent.clientWidth || window.innerWidth;
    const h = parent.clientHeight || window.innerHeight;
    threeRenderer.setSize(w, h);
    threeCamera.aspect = w / h;
    threeCamera.updateProjectionMatrix();
  }

  function animateThree() {
    requestAnimationFrame(animateThree);
    if (threeControls) threeControls.update();
    if (threeRenderer && threeScene && threeCamera) {
      threeRenderer.render(threeScene, threeCamera);
    }
  }

  function buildHexWorld(payload) {
    if (!threeScene) return;

    // Clear old tiles
    for (const key of Object.keys(tileMeshes)) {
      threeScene.remove(tileMeshes[key]);
    }
    tileMeshes = {};

    // Clear old player meshes
    for (const key of Object.keys(playerMeshes)) {
      threeScene.remove(playerMeshes[key]);
    }
    playerMeshes = {};

    const tiles = payload.tiles || [];
    const hexGeo = new THREE.CylinderGeometry(0.9, 0.9, 0.3, 6);

    tiles.forEach(tile => {
      const { q, r, type } = tile;
      const color = TILE_COLORS[type] || 0x888888;
      const height = TILE_HEIGHTS[type] || 0;
      const material = new THREE.MeshLambertMaterial({ color });
      const mesh = new THREE.Mesh(hexGeo, material);

      const pos = hexToWorld(q, r);

      // Scale Y for mountains, adjust pivot so base stays grounded
      if (type === 'mountain') {
        mesh.scale.set(1, 3, 1);
        // CylinderGeometry h=0.3, scaled 3x → actual h=0.9, half=0.45
        // Place so bottom aligns with height offset
        mesh.position.set(pos.x, height + 0.45, pos.z);
      } else {
        mesh.position.set(pos.x, height, pos.z);
      }

      mesh.userData = { q, r, type };
      threeScene.add(mesh);
      tileMeshes[`${q},${r}`] = mesh;
    });

    // Center camera on map
    const radius = payload.radius || 4;
    threeCamera.position.set(0, radius * 2.5, radius * 2);
    threeCamera.lookAt(0, 0, 0);
    if (threeControls) threeControls.target.set(0, 0, 0);
  }

  function updatePlayerMeshes(players) {
    if (!threeScene) return;

    players.forEach(p => {
      if (p.q == null || p.r == null) return;
      const pos = hexToWorld(p.q, p.r);

      if (playerMeshes[p.id]) {
        playerMeshes[p.id].position.set(pos.x, 0.5, pos.z);
      } else {
        const geo = new THREE.SphereGeometry(0.25, 16, 16);
        const isMe = p.id === playerId;
        const mat = new THREE.MeshLambertMaterial({
          color: isMe ? 0x6c63ff : 0xff6b6b
        });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(pos.x, 0.5, pos.z);
        threeScene.add(mesh);
        playerMeshes[p.id] = mesh;
      }
    });
  }

  function showMoveButtons(moves) {
    const ui = $('world-ui');
    ui.innerHTML = '';

    const dirLabels = ['→', '↗', '↖', '←', '↙', '↘'];

    moves.forEach((move, i) => {
      const btn = document.createElement('button');
      btn.className = 'move-btn';
      btn.textContent = dirLabels[i % dirLabels.length];
      btn.addEventListener('click', () => {
        channel.send({
          type: 'broadcast',
          event: 'action',
          payload: {
            playerId,
            action: 'move',
            target: { q: move.q, r: move.r }
          }
        });
        ui.innerHTML = '';
        $('world-status').textContent = '移動中...';
        isMyTurn = false;
      });
      ui.appendChild(btn);
    });
  }

})();
</script>
</body>
</html>
